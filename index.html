<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>令和8年度収穫祭 大抽選会</title>
<style>
:root{
  --gold:#ffd54a; --gold2:#ff9f1c; --red:#e8265a; --ink:#2a0a3a;
  --bg1:#12002b; --bg2:#4a0d52;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
  color:#fff; overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg1) 70%);
}
/* きらめく背景 */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:
    radial-gradient(2px 2px at 20% 30%,#fff,transparent),
    radial-gradient(2px 2px at 70% 20%,#ffe9a0,transparent),
    radial-gradient(3px 3px at 40% 80%,#fff,transparent),
    radial-gradient(2px 2px at 85% 65%,#ffd0e0,transparent),
    radial-gradient(2px 2px at 10% 70%,#fff,transparent),
    radial-gradient(3px 3px at 60% 50%,#ffe9a0,transparent);
  background-size:300px 300px;
  animation:drift 24s linear infinite;
}
@keyframes drift{to{background-position:300px 600px}}

#bar{
  position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;
  padding:.6rem 1rem;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);
  border-bottom:1px solid rgba(255,255,255,.15);font-size:14px;
}
#bar h1{font-size:18px;color:var(--gold);margin-right:auto;white-space:nowrap}
#bar label{display:flex;align-items:center;gap:.4rem;white-space:nowrap}
#bar input[type=number]{width:5.5em}
#bar input[type=text]{width:11em}
#bar #inTitle{width:16em}
#bar input{padding:.35rem .5rem;border-radius:6px;border:1px solid #888;background:#1d0b30;color:#fff;font-size:14px}
#bar button{padding:.4rem .8rem;border-radius:6px;border:1px solid rgba(255,255,255,.3);
  background:#3b1f5c;color:#fff;cursor:pointer;font-size:14px}
#bar button:hover{background:#56308a}
body.hideBar #bar{display:none}
body.hideBar .reel{--fs:min(calc(54vw / (var(--n) * .78)),34vh)}   /* 1920x1080：設定バーを隠すとリールを大きく */
body.hideBar #showBar{display:block}
#showBar{display:none;position:fixed;top:6px;right:8px;z-index:6;opacity:.25;font-size:12px;
  background:none;border:none;color:#fff;cursor:pointer}
#showBar:hover{opacity:1}

main{position:relative;z-index:1;display:grid;grid-template-columns:1fr 22vw;gap:1.5vw;
  height:calc(100% - var(--barh,56px));padding:1vh 1.5vw}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;min-width:0}
.title{font-size:min(7vh,4.4vw);font-weight:900;letter-spacing:.12em;text-align:center;white-space:nowrap;
  background:linear-gradient(#fff6c4,#ffd54a 55%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,160,40,.6)) drop-shadow(0 3px 0 rgba(90,30,0,.7))}
.prize{font-size:min(4.2vh,2.8vw);font-weight:900;color:var(--gold);letter-spacing:.1em;
  text-shadow:0 0 18px rgba(255,213,74,.7);min-height:1.2em;text-align:center}

.machine{
  --n:2; position:relative;padding:min(2.2vh,1.4vw);border-radius:2.5vmin;
  background:linear-gradient(145deg,#ffe58a,#d9902a 45%,#fff0a8 60%,#c07a14);
  box-shadow:0 0 0 .6vmin #7a4a0a,0 1.5vh 4vh rgba(0,0,0,.6),0 0 6vh rgba(255,200,60,.35);
}
.machine .lights::before,.machine .lights::after{
  content:"";position:absolute;inset:.5vmin;border-radius:2vmin;pointer-events:none;
  border:.9vmin dotted #fff;
}
.machine .lights::before{animation:blinkA .7s steps(1) infinite;border-color:#fff6a8}
.machine .lights::after{animation:blinkA .7s steps(1) infinite reverse;border-color:#ff5a7a}
@keyframes blinkA{0%{opacity:1}50%{opacity:0}}
.machine.spinning .lights::before,.machine.spinning .lights::after{animation-duration:.18s}
.machine.win{animation:shake .5s 2, glow 1s ease-in-out infinite alternate}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px) rotate(-.4deg)}
  40%{transform:translate(8px,-4px) rotate(.4deg)}60%{transform:translate(-6px,-2px)}80%{transform:translate(6px,2px)}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25) saturate(1.3)}}

.reels{position:relative;display:flex;gap:1.2vmin;padding:1.2vmin;border-radius:1.6vmin;background:#3a1200;
  box-shadow:inset 0 0 2vmin #000}
.reel{
  --fs:min(calc(54vw / (var(--n) * .78)),29vh);
  font-size:var(--fs);width:.78em;height:1.15em;overflow:hidden;position:relative;border-radius:1vmin;
  background:linear-gradient(#cdbfa6,#fffaf0 18%,#fffaf0 82%,#cdbfa6);
}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.55),transparent 22%,transparent 78%,rgba(0,0,0,.55));}
.strip{will-change:transform}
.cell{height:1.15em;line-height:1.15em;text-align:center;font-weight:900;color:#b3123a;
  font-family:"Arial Black","Impact","Hiragino Sans",sans-serif;font-variant-numeric:tabular-nums}
.machine.idle .reel{opacity:.85}
.machine.win .reel{background:linear-gradient(#e6c76a,#fff8d0 18%,#fff8d0 82%,#e6c76a)}

.caption{font-size:min(4.4vh,2.6vw);font-weight:700;min-height:1.4em;text-align:center;
  text-shadow:0 2px 8px rgba(0,0,0,.6)}
.caption.suspense{color:#ff8fab;animation:pulse .5s ease-in-out infinite alternate}
.caption.win{font-size:min(8vh,5vw);color:var(--gold);font-weight:900;
  text-shadow:0 0 20px #ff9f1c,0 0 40px #e8265a;animation:pop .6s cubic-bezier(.2,2,.4,1)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

.draw{
  font-size:min(5vh,3vw);font-weight:900;letter-spacing:.15em;padding:1.4vh 4vw;border-radius:999px;
  border:none;cursor:pointer;color:#fff;
  background:linear-gradient(#ff5a7a,#c4123f);
  box-shadow:0 .8vh 0 #7d0a28,0 1.5vh 3vh rgba(0,0,0,.5);
  transition:transform .08s,box-shadow .08s;
}
.draw:hover:not(:disabled){filter:brightness(1.12)}
.draw:active:not(:disabled){transform:translateY(.6vh);box-shadow:0 .2vh 0 #7d0a28}
.draw:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.draw.ready{animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.remain{font-size:min(2.6vh,1.6vw);opacity:.85}
.hint{font-size:min(2vh,1.2vw);opacity:.5}

.history{display:flex;flex-direction:column;min-height:0;background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:1vh .8vw}
.history h2{font-size:min(2.6vh,1.5vw);color:var(--gold);margin-bottom:.8vh;text-align:center}
#hist{list-style:none;overflow:auto;flex:1;display:flex;flex-direction:column;gap:.6vh}
#hist li{display:flex;align-items:center;gap:.6em;padding:.5vh .6vw;border-radius:8px;cursor:pointer;
  background:rgba(255,255,255,.08);font-size:min(3vh,1.8vw);animation:slide .4s ease-out}
#hist li:first-child{background:linear-gradient(90deg,rgba(255,213,74,.35),rgba(255,255,255,.08))}
#hist .num{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;min-width:2.4em}
#hist .lbl{font-size:.7em;opacity:.8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hist .mark{display:none;font-size:.6em;background:#777;border-radius:4px;padding:0 .4em}
#hist li.absent .num{text-decoration:line-through;color:#999}
#hist li.absent .mark{display:inline}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.history .note{font-size:min(1.8vh,1vw);opacity:.5;margin-top:.6vh;text-align:center}

/* 暗転（スポットライト）：最後の1桁の前に周りを暗くする */
.title,.prize,.remain,.hint,.history,.bg{transition:opacity .7s}
body.dim .title,body.dim .prize,body.dim .remain,body.dim .hint,body.dim .history{opacity:.1}
body.dim .bg{opacity:.12}
body.dim .machine{box-shadow:0 0 0 .6vmin #7a4a0a,0 0 14vh 5vh rgba(255,213,74,.6);animation:heart .9s ease-in-out infinite}
@keyframes heart{0%,100%{transform:scale(1)}15%{transform:scale(1.025)}30%{transform:scale(1)}45%{transform:scale(1.015)}}
/* リーチ */
.machine.reach{box-shadow:0 0 0 .6vmin #7a0a1c,0 0 9vh 3vh rgba(255,40,70,.75)}
.machine.reach .lights::before,.machine.reach .lights::after{animation-duration:.12s}
.machine.buzz{animation:shake .5s 2}
/* カットイン */
#cutin{position:fixed;left:0;right:0;top:34%;height:24vh;z-index:18;pointer-events:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(232,38,90,.94) 12%,rgba(255,110,40,.94) 50%,rgba(232,38,90,.94) 88%,transparent);
  font-size:15vh;font-weight:900;letter-spacing:.1em;color:#fff;white-space:nowrap;
  text-shadow:0 0 30px #ffd54a,.5vh .5vh 0 #7d0a28;transform:translateX(-110%) skewX(-12deg)}
#cutin.go{animation:cut 1.9s cubic-bezier(.2,.8,.2,1)}
@keyframes cut{0%{transform:translateX(-110%) skewX(-12deg)}18%,78%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(110%) skewX(-12deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
#flash{position:fixed;inset:0;pointer-events:none;z-index:19;background:#fff;opacity:0}
#flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

@media (max-width:800px){
  main{grid-template-columns:1fr;grid-template-rows:1fr 20vh}
  .history{padding:.5rem}
  #hist li{font-size:16px}
}
</style>
</head>
<body>
<div class="bg"></div>

<header id="bar">
  <h1>🎊 抽選スロット</h1>
  <label>タイトル <input id="inTitle" type="text" value="令和8年度収穫祭 大抽選会"></label>
  <label>クジ番号 <input id="inStart" type="number" min="1" max="99" value="1"> 〜 <input id="inEnd" type="number" min="1" max="99" value="30"></label>
  <label title="ひっかけ演出は、この回数目の抽選から起こり始め、最後の抽選（クジ番号の総数）に向けて少しずつ起こりやすくなります">ひっかけ <input id="inFake" type="number" min="1" max="99" step="1" value="6">回目〜</label>
  <label title="スタートから止まるまでの基本時間。実際は毎回ランダムで約0.5〜1.6倍になります">基本時間 <input id="inBase" type="number" min="4" max="30" step="1" value="8">秒</label>
  <label>賞の名前 <input id="inLabel" type="text" placeholder="例：豪華景品"></label>
  <button id="btnApply" title="番号の範囲を反映（抽選履歴はリセット）">設定を反映</button>
  <button id="btnSound">🔊 音ON</button>
  <button id="btnFull">⛶ 全画面</button>
  <button id="btnHide" title="Hキーでも切替">設定を隠す</button>
  <button id="btnReset">リセット</button>
</header>
<button id="showBar">⚙ 設定</button>

<main>
  <section class="stage">
    <h2 class="title" id="title"></h2>
    <div class="prize" id="prize"></div>
    <div class="machine idle" id="machine">
      <div class="lights"></div>
      <div class="reels" id="reels"></div>
    </div>
    <div class="caption" id="caption">ボタンを押して抽選スタート！</div>
    <button class="draw ready" id="drawBtn">抽選スタート！</button>
    <div class="remain" id="remain"></div>
    <div class="hint">Space / Enter：抽選　F：全画面　H：設定の表示切替　M：音</div>
  </section>
  <aside class="history">
    <h2>🏆 当選番号</h2>
    <ul id="hist"></ul>
    <div class="note">番号をクリックで「欠席」切替<br>（欠席でも再抽選には戻りません）</div>
  </aside>
</main>

<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="cutin"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const STORE = 'nenkai-lottery-v1';
const SPIN_SPEED = 14;            // リールの回転速度（桁/秒）

/* ============ 状態 ============ */
let S = { title:'令和8年度収穫祭 大抽選会', start:1, end:30, label:'', base:8, fakeFrom:6, drawn:[] };   // drawn: [{n,label,absent}]
let FORCE = null, FORCEN = null;
let width = 2, reels = [], spinning = false, soundOn = true;

function load(){
  try{ const o = JSON.parse(localStorage.getItem(STORE)); if(o && o.drawn) S = Object.assign(S,o); }catch(e){}
  S.end = Math.min(99,S.end); S.start = Math.max(1,Math.min(S.start,S.end));   // 00は除外
  S.fakeFrom = Math.min(99,Math.max(1,parseInt(S.fakeFrom,10)||6)); S.base = Math.min(30,Math.max(4,+S.base||8));
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
const pad = n => String(n).padStart(width,'0');
const pool = () => {
  const used = new Set(S.drawn.map(d=>d.n)), p = [];
  for(let i=S.start;i<=S.end;i++) if(!used.has(i)) p.push(i);
  return p;
};
function rnd(max){           // 0..max-1 の一様乱数（crypto使用）
  const a = new Uint32Array(1), lim = Math.floor(4294967296/max)*max;
  do{ crypto.getRandomValues(a); }while(a[0]>=lim);
  return a[0]%max;
}

/* ============ サウンド（外部ファイル不要・WebAudio） ============ */
const Snd = {
  ctx:null, master:null, nbuf:null,
  init(){
    if(!this.ctx){
      const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .8;
      const comp = this.ctx.createDynamicsCompressor();   // 音が重なっても割れにくくする
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate*2, b = this.ctx.createBuffer(1,len,this.ctx.sampleRate), d = b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.nbuf = b;
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
    return true;
  },
  ok(){ return soundOn && this.ctx; },
  tone(f,t,dur,type='square',vol=.15,slide){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+.02);
  },
  noise(t,dur,vol,type,freq,q=1,swell=false){
    const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.nbuf; s.loop=true; f.type=type; f.frequency.value=freq; f.Q.value=q;
    if(swell){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*.4); }
    else g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t,Math.random()); s.stop(t+dur+.02);
  },
  tick(){ if(!this.ok())return; this.tone(1400,this.ctx.currentTime,.04,'square',.07); },
  roll(vol){ if(!this.ok())return; this.noise(this.ctx.currentTime,.05,vol,'bandpass',1700,.8); },
  start(){ if(!this.ok())return; const t=this.ctx.currentTime;
    this.tone(180,t,.5,'sawtooth',.12,900); this.noise(t,.4,.12,'highpass',3000); },
  thump(v=1){ if(!this.ok())return; const t=this.ctx.currentTime;
    this.tone(170,t,.28,'sine',.6*v,45); this.noise(t,.06,.2*v,'lowpass',1200); },
  rumble(){ if(!this.ok())return; const t=this.ctx.currentTime; this.noise(t,.9,.45,'lowpass',160,1); this.tone(55,t,.9,'sawtooth',.25,40); },
  reach(){ if(!this.ok())return; const t=this.ctx.currentTime;
    this.tone(440,t,.16,'square',.13); this.tone(660,t+.16,.16,'square',.13); this.tone(880,t+.32,.5,'square',.14);
    this.noise(t,.6,.2,'bandpass',1500,.8,true); },
  cutin(){ if(!this.ok())return; const t=this.ctx.currentTime;
    this.noise(t,.5,.4,'highpass',3500); this.tone(90,t,.6,'sawtooth',.3,45);
    [220,277.2,329.6,440].forEach(f=>this.tone(f,t+.12,.9,'sawtooth',.09)); this.taiko(t+.1,.9); },
  fakewin(){ if(!this.ok())return; const t=this.ctx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,t+i*.1,.25,'square',.11)); this.noise(t+.3,.8,.2,'bandpass',2500,.7,true); },
  buzzer(){ if(!this.ok())return; const t=this.ctx.currentTime;      // 「ブッブー」
    this.tone(150,t,.28,'sawtooth',.28); this.tone(150,t+.36,.5,'sawtooth',.28); this.tone(155,t,.28,'square',.1); this.tone(155,t+.36,.5,'square',.1); },
  zorome(){ if(!this.ok())return; const t=this.ctx.currentTime;      // ゾロ目ボーナス
    for(let i=0;i<14;i++) this.taiko(t+i*.065,.35+i*.04);
    this.tone(300,t,1.2,'sawtooth',.12,2400);
    for(let i=0;i<24;i++) this.tone(1318.5*Math.pow(2,(i%5)/5*(i<12?1:2)),t+1.6+i*.07,.5,'sine',.07);
    this.noise(t+1.3,2.2,.35,'highpass',6000); },
  fake(){ if(!this.ok())return; const t=this.ctx.currentTime;     // 「ピロッ！」動き出し予告
    this.tone(500,t,.22,'square',.1,1500); this.tone(1000,t+.08,.2,'triangle',.08,2000); },
  suspense(){ if(!this.ok())return; const t=this.ctx.currentTime;   // ドン…ドン… 心臓音
    this.tone(70,t,.18,'sine',.7,40); this.tone(70,t+.16,.18,'sine',.5,40); },
  taiko(t,vol=.9){ this.tone(160,t,.4,'sine',vol,48); this.noise(t,.12,vol*.5,'lowpass',500); },
  fanfare(){
    if(!this.ok())return; const t=this.ctx.currentTime, R=(a,b)=>a+Math.random()*(b-a);
    // 1) くす玉「パーン！」＋和太鼓「ドン ドン ドドドン！」
    this.noise(t,.18,.7,'bandpass',2200,.6); this.noise(t,.5,.35,'highpass',4000);
    [0,.32,.64,.78,.92].forEach((d,i)=>this.taiko(t+d,i<2?.9:.7));
    // 2) ファンファーレ（ブラス風）
    const m=t+1.1;
    [[392,0,.14],[523.25,.14,.14],[659.25,.28,.14],[783.99,.42,.14],[1046.5,.62,1.6]].forEach(([f,d,l],i)=>{
      this.tone(f,m+d,l,'sawtooth',.13); this.tone(f*2,m+d,l,'square',.04);
      if(i>=2) this.tone(f*1.25,m+d,l,'sawtooth',.06);      // 長3度の和音で明るく
      if(i===4){ this.tone(f*1.5,m+d,l,'sawtooth',.06); this.tone(f/2,m+d,l,'triangle',.18); }
    });
    // 3) 琴・鈴のようなキラキラ音（ペンタトニック）
    const pent=[1046.5,1174.7,1318.5,1568,1760,2093,2349.3];
    for(let i=0;i<30;i++) this.tone(pent[rnd(pent.length)],m+.1+i*.075+R(0,.03),.7,'sine',.05+R(0,.03));
    // 4) シンバル
    this.noise(m+.62,2.6,.4,'highpass',6000);
    // 5) 大歓声と拍手
    this.noise(m+.3,3.6,.3,'bandpass',900,.5,true);
    for(let i=0;i<110;i++){
      const k=i/110; this.noise(m+.5+k*3.2+R(0,.05),.04,.12*(1-k*.6)+.03,'bandpass',R(1800,4200),1.2);
    }
    // 6) 締めの「ポン！」
    this.tone(1318.5,m+2.5,.5,'sine',.15); this.tone(1568,m+2.62,.8,'sine',.15);
  }
};

/* ============ リール ============ */
const EASE={
  out:t=>1-Math.pow(1-t,3),
  inout:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  sine:t=>-(Math.cos(Math.PI*t)-1)/2
};
class Reel{
  constructor(el){
    this.el=el; this.strip=document.createElement('div'); this.strip.className='strip';
    for(let k=0;k<20;k++){ const c=document.createElement('div'); c.className='cell'; c.textContent=k%10; this.strip.appendChild(c); }
    el.appendChild(this.strip); this.pos=0; this.mode='idle'; this.lastFloor=0; this.segs=[]; this.cur=null; this.render(0);
  }
  set(d){ this.pos=(10-d)%10; this.mode='idle'; this.render(0); }
  spin(){ this.mode='spin'; }
  /* variant: normal=普通 / restart=止まったと思ったら動き出す / back=1つ戻る /
              crawl=じりじり / fast=やけに早く止まる */
  stop(d,dur,cb,variant='normal'){
    const start=this.pos, dist=Math.ceil(SPIN_SPEED*dur/3), raw=start+dist;
    const end=Math.ceil((raw+d)/10)*10-d;       // 表示桁 = (-pos) mod 10 なので pos ≡ -d
    this.end=end; this.cb=cb; this.segs=[]; this.cur=null; this.released=false; this.lastFloor=Math.floor(start);
    const mv=(to,du,ease,o={})=>this.segs.push(Object.assign({type:'move',to,dur:du,ease},o));
    const hold=(du,o={})=>this.segs.push(Object.assign({type:'hold',dur:du},o));
    const soft=()=>Snd.thump(.55);
    if(variant==='restart'){                      // 止まった…と思いきや、また動いて1〜3つ進む
      const k=1+rnd(3);
      mv(end-k,dur*.9,'out',{onEnd:soft}); hold(.5+rnd(500)/1000);
      for(let j=1;j<=k;j++){
        mv(end-k+j,.42,'inout',j===1?{onStart:()=>{Snd.fake();setCaption('あれ…？動いた！？','suspense');}}:{});
        if(j<k) hold(.12);
      }
    }else if(variant==='back'){                   // 行き過ぎて1つ逆戻り
      mv(end+1,dur,'out',{onEnd:soft}); hold(.5+rnd(400)/1000);
      mv(end,.55,'inout',{onStart:()=>{Snd.fake();setCaption('戻る…！？','suspense');}});
    }else if(variant==='crawl'){                  // ほぼ止まってから、じりじり
      const k=2+rnd(2);
      mv(end-k,dur*.85,'out');
      for(let j=1;j<=k;j++){
        mv(end-k+j-.4,.7+rnd(400)/1000,'sine',j===1?{onStart:()=>setCaption('じり…じり…','suspense')}:{});
        hold(.22+rnd(250)/1000); mv(end-k+j,.3,'inout',{onEnd:()=>Snd.tick()});
      }
    }else if(variant==='bounce'){                 // 行き過ぎてビヨヨンと跳ね返る
      mv(end+.35,dur,'out',{onEnd:()=>Snd.thump(.7)}); mv(end-.18,.2,'inout'); mv(end+.08,.14,'inout'); mv(end,.12,'inout');
    }else if(variant==='wobble'){                 // 狙いの手前でブルブル震える
      mv(end-.4,dur*.9,'out',{onEnd:()=>{Snd.rumble();setCaption('ブルブル…！？','suspense');}});
      [.3,-.25,.2,-.12,.06].forEach(a=>mv(end+a,.1,'inout')); mv(end,.1,'inout');
    }else if(variant==='park'){                   // 1つ手前で止まって待機 → release() で1つ動く
      mv(end-1,dur,'out',{onEnd:soft}); this.segs.push({type:'wait'});
    }else mv(end,dur,'out');                       // normal / fast
    this.mode='stop';
  }
  release(){ this.released=true; }
  update(now,dt){
    const prev=this.pos;
    if(this.mode==='spin'){ this.pos+=SPIN_SPEED*dt; if(this.pos>1000)this.pos-=1000; }
    else if(this.mode==='stop'){
      if(!this.cur){
        const sg=this.segs.shift();
        if(sg){ this.cur=sg; sg.t0=now; sg.from=this.pos; sg.onStart&&sg.onStart(); }
      }
      if(this.cur && this.cur.type==='wait'){
        if(this.released){ this.cur=null; this.segs.unshift({type:'move',to:this.end,dur:.33,ease:'inout'}); }
      } else if(this.cur){
        const sg=this.cur, t=Math.min(1,(now-sg.t0)/(sg.dur*1000));
        if(sg.type==='move') this.pos=sg.from+(sg.to-sg.from)*EASE[sg.ease](t);
        if(t>=1){ if(sg.type==='move') this.pos=sg.to; this.cur=null; sg.onEnd&&sg.onEnd(); }
      }
      if(!this.cur && !this.segs.length){
        this.pos=((this.end%10)+10)%10; this.mode='done'; this.render(0);
        const cb=this.cb; this.cb=null; cb&&cb(); return;
      }
      const f=Math.floor(this.pos); if(f!==this.lastFloor){ this.lastFloor=f; Snd.tick(); }
    } else return;
    const speed=Math.abs(this.pos-prev)/Math.max(dt,.001);   // 速さに応じてブラー
    this.render(Math.min(3,Math.max(0,(speed-3)/11*3)));
  }
  render(blur){
    const idx=((-this.pos)%10+10)%10;      // pos が増えるほど数字は上→下へ流れる
    this.strip.style.transform=`translateY(${-idx/20*100}%)`;
    this.strip.style.filter=blur>.3?`blur(${blur.toFixed(1)}px)`:'';
  }
}
function buildReels(){
  width = 2;                       // 2桁固定
  const box=$('reels'); box.innerHTML=''; reels=[];
  $('machine').style.setProperty('--n',width);
  box.querySelectorAll('.reel').forEach(r=>r.style.setProperty('--n',width));
  for(let i=0;i<width;i++){
    const el=document.createElement('div'); el.className='reel'; el.style.setProperty('--n',width);
    box.appendChild(el); reels.push(new Reel(el));
  }
}
function showNumber(n){ const s=pad(n); reels.forEach((r,i)=>r.set(+s[i])); }

/* ============ 紙吹雪 ============ */
const cv=$('fx'), cx=cv.getContext('2d'); let parts=[], dpr=1;
function resizeFx(){ dpr=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; }
addEventListener('resize',()=>{resizeFx();fitBar();}); resizeFx();
const COLORS=['#ffd54a','#ff5a7a','#4fd1ff','#8dff6b','#ff9f1c','#d68bff','#fff'];
function burst(x,y,n,ang,spread,power){
  for(let i=0;i<n;i++){
    const a=ang+(Math.random()-.5)*spread, v=power*(.4+Math.random()*.8);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:3+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:COLORS[rnd(COLORS.length)],life:0,max:140+Math.random()*100,round:Math.random()<.25});
  }
}
function rain(n){
  for(let i=0;i<n;i++) parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
    r:4+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:COLORS[rnd(COLORS.length)],life:0,max:260,round:Math.random()<.2});
}
function celebrate(){
  const W=innerWidth,H=innerHeight;
  burst(0,H,120,-Math.PI/3,.9,26); burst(W,H,120,-Math.PI*2/3,.9,26);
  burst(W/2,H*.45,150,-Math.PI/2,Math.PI*2,22);
  rain(120);
  [400,900,1500,2200,2900,3600].forEach((t,k)=>setTimeout(()=>{
    burst(Math.random()*W,H*(.2+Math.random()*.3),90,0,Math.PI*2,18);
    if(k%2) burst(0,H,60,-Math.PI/3,.9,26), burst(W,H,60,-Math.PI*2/3,.9,26);
    if(k==2||k==5) rain(100);
  },t));
}
function stepFx(){
  cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,cv.width,cv.height); cx.scale(dpr,dpr);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life++; p.vy+=.35; p.vx*=.992; p.vy*=.992; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    if(p.life>p.max||p.y>innerHeight+30){ parts.splice(i,1); continue; }
    cx.globalAlpha=Math.min(1,(p.max-p.life)/30); cx.fillStyle=p.c;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    if(p.round){ cx.beginPath(); cx.arc(0,0,p.r*.6,0,7); cx.fill(); } else cx.fillRect(-p.r,-p.r*.5,p.r*2,p.r);
    cx.restore();
  }
}

/* ============ メインループ ============ */
let last=performance.now(), nextRoll=0, rollStart=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  reels.forEach(r=>r.update(now,dt));
  if(spinning && now>=nextRoll){                       // ドラムロール
    const k=Math.min(1,(now-rollStart)/6000);
    Snd.roll(.05+.2*k); nextRoll=now+75-30*k;
  }
  if(parts.length) stepFx(); else if(cx) cx.clearRect(0,0,cv.width,cv.height);
  requestAnimationFrame(frame);
}

/* ============ 抽選 ============ */
const cap=$('caption'), machine=$('machine'), btn=$('drawBtn');
function setCaption(t,cls=''){ cap.className='caption '+cls; cap.textContent=t; }

const cutin=$('cutin');
function showCutin(){
  const T=['激アツ！！','チャンス！','キタキタキタ！','予感…！','熱い！！'];
  cutin.textContent=T[rnd(T.length)]; cutin.classList.remove('go'); void cutin.offsetWidth; cutin.classList.add('go');
  Snd.cutin();
}
function draw(){
  if(spinning) return;
  const p=pool(); if(!p.length) return;
  Snd.init();
  const n=(FORCEN!=null&&p.includes(FORCEN))?FORCEN:p[rnd(p.length)], s=pad(n);   // 先に当選番号を確定
  spinning=true; btn.disabled=true; btn.classList.remove('ready'); btn.textContent='抽選中…';
  machine.classList.remove('idle','win','reach','buzz'); machine.classList.add('spinning');
  document.body.classList.remove('dim');
  setCaption('回転中…ドキドキ！'); $('prize').textContent=S.label;
  Snd.start(); reels.forEach(r=>r.spin()); rollStart=performance.now(); nextRoll=0;

  // 止まるまでの総時間 = 基本時間 × 0.5〜1.6倍のランダム
  const T=Math.min(45,Math.max(4,S.base*(0.5+rnd(1101)/1000)));
  const D1=Math.min(3.4,T*.5)*1000, lastAt=T*1000-D1, firstAt=lastAt*.5;

  // ---- 演出プラン：開始回数以降に発生し、終盤ほど起こりやすくなる ----
  const idx=S.drawn.length+1, active=idx>=S.fakeFrom;
  const total=S.end-S.start+1;                       // 抽選回数 = クジ番号の総数
  const prog=total<=S.fakeFrom?1:Math.min(1,Math.max(0,(idx-S.fakeFrom)/(total-S.fakeFrom)));
  const rv=()=>{ const r=rnd(100); return r<20?'restart':r<38?'back':r<56?'crawl':r<70?'fast':r<85?'bounce':'wobble'; };
  const NORM=['normal','normal'];
  const plan=(()=>{
    if(!active) return {kind:'normal',v:NORM};
    if(FORCE){
      if(FORCE==='nudge') return {kind:'nudge',v:['park','normal']};
      if(['together','fakewin'].includes(FORCE)) return {kind:FORCE,v:NORM};
      if(['dim','cutin'].includes(FORCE)) return {kind:'normal',v:NORM};
      return {kind:'reel',v:[FORCE,FORCE]};                                  // テスト用
    }
    if(rnd(1000)>=(.25+.6*prog)*1000) return {kind:'normal',v:NORM};          // 発生率 25% → 85%
    const r=rnd(100);
    if(r<22) return {kind:'reel',v:[rv(),'normal']};         // 1桁目だけ
    if(r<36) return {kind:'reel',v:['normal',rv()]};         // 2桁目だけ
    if(r<46) return {kind:'reel',v:[rv(),rv()]};             // 両方
    if(r<64) return {kind:'together',v:NORM};                // 同時に止まる
    if(r<88) return {kind:'nudge',v:['park','normal']};      // 2桁目が止まると同時に1桁目が1つ動く
    return prog>=.35?{kind:'fakewin',v:NORM}:{kind:'together',v:NORM};   // フェイク当選（中盤以降）
  })();
  // 画面演出（当選結果とは無関係の飾り）：暗転・カットイン
  const useDim=active&&(FORCE==='dim'||(!FORCE&&rnd(100)<10+25*prog));
  const useCut=active&&(FORCE==='cutin'||(!FORCE&&rnd(100)<12+28*prog));
  if(useCut) setTimeout(()=>{ if(spinning) showCutin(); },lastAt*(.12+rnd(25)/100));

  // フェイク当選用の「ウソの番号」
  let fk=n;
  if(plan.kind==='fakewin'){
    const lo=S.end>S.start?S.start:1, hi=S.end>S.start?S.end:99;
    do{ fk=lo+rnd(hi-lo+1); }while(fk===n);
  }
  let fakePhase=plan.kind==='fakewin', done=0;
  const zoro=s[0]===s[1];

  const suspenseFx=()=>{
    setCaption(plan.kind==='together'?'せーの…！？':(zoro&&!fakePhase?'ゾロ目になるか…！？':'最後の1桁は…！？'),'suspense');
    Snd.suspense(); setTimeout(()=>Snd.suspense(),520); setTimeout(()=>Snd.suspense(),1040);
    if(useDim) document.body.classList.add('dim');
  };
  const cbFor=i=>()=>{
    const last=i===reels.length-1;
    Snd.thump();
    if(last&&plan.kind==='nudge'&&!fakePhase) reels[0].release();   // 2桁目が止まった瞬間に1桁目が動く
    done++;
    if(done===reels.length){ fakePhase?fakeFlow():reveal(n); }
    else if(!last){
      if(zoro&&!fakePhase){ setCaption('リーチ！！','suspense'); machine.classList.add('reach'); Snd.reach(); }
      else setCaption(s.slice(0,i+1).padEnd(width,'?').split('').join(' '));
    }
  };
  // フェイク当選：いったん偽の番号で当選っぽく止める→「ブッブー」→再回転
  const fakeFlow=()=>{
    document.body.classList.remove('dim'); machine.classList.add('win');
    setCaption(`🎉 ${pad(fk)} 番　当選！？ 🎉`,'win'); Snd.fakewin();
    setTimeout(()=>{ machine.classList.remove('win'); machine.classList.add('buzz'); setCaption('…と思った？','suspense'); Snd.buzzer(); },1600);
    setTimeout(()=>{
      machine.classList.remove('buzz'); setCaption('まだまだ！本番はここから！','suspense');
      fakePhase=false; done=0; Snd.start(); reels.forEach(r=>r.spin()); rollStart=performance.now(); nextRoll=0;
      setTimeout(()=>reels[0].stop(+s[0],1.4,cbFor(0)),1200);
      setTimeout(suspenseFx,1800);
      setTimeout(()=>reels[1].stop(+s[1],3,cbFor(1)),2500);
    },2900);
  };

  const digits=fakePhase?pad(fk):s;
  reels.forEach((r,i)=>{
    const last=i===reels.length-1, v=plan.v[i];
    let at=last?lastAt:firstAt, dur=last?D1/1000:Math.min(1.5,lastAt/1000*.6);
    if(plan.kind==='together'||fakePhase){ at=lastAt; dur=D1/1000; }          // 両桁を同時に減速・停止
    if(v==='fast'){ dur=.55; at=last?Math.max(firstAt+900,lastAt*.55):Math.max(500,firstAt*.35); }
    if(last) setTimeout(suspenseFx,Math.max(0,at-1400));
    setTimeout(()=>r.stop(+digits[i],dur,cbFor(i),v),at);
  });
}

function reveal(n){
  spinning=false;
  S.drawn.push({n,label:S.label,absent:false}); save();
  const z=pad(n)[0]===pad(n)[1];
  document.body.classList.remove('dim'); machine.classList.remove('spinning','reach','buzz'); machine.classList.add('win');
  setCaption(z?`🎉 ${pad(n)}　ゾロ目！！ 🎉`:`🎉 ${pad(n)} 番　当選！ 🎉`,'win');
  Snd.fanfare(); celebrate();
  if(z){ Snd.zorome(); setTimeout(celebrate,1700); setTimeout(celebrate,3400); }   // ゾロ目ボーナス：紙吹雪を追加
  const f=$('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  setTimeout(()=>machine.classList.remove('win'),z?6500:4500);
  renderHist(); updateBtn();
}

function updateBtn(){
  const left=pool().length, total=S.end-S.start+1;
  $('remain').textContent=`残り ${left} / 全 ${total} 枚　（${S.start}〜${S.end}番）`;
  if(left>0){ btn.disabled=false; btn.classList.add('ready'); btn.textContent=S.drawn.length?'もう一回！':'抽選スタート！'; }
  else { btn.disabled=true; btn.classList.remove('ready'); btn.textContent='全員抽選済み'; }
}
function renderHist(){
  const ul=$('hist'); ul.innerHTML='';
  for(let i=S.drawn.length-1;i>=0;i--){
    const d=S.drawn[i], li=document.createElement('li');
    if(d.absent) li.className='absent';
    li.innerHTML='<span class="num"></span><span class="lbl"></span><span class="mark">欠席</span>';
    li.querySelector('.num').textContent=pad(d.n);
    li.querySelector('.lbl').textContent=d.label||'';
    li.onclick=()=>{ if(spinning)return; d.absent=!d.absent; save(); renderHist(); };
    ul.appendChild(li);
  }
}

/* ============ 設定・操作 ============ */
function applySettings(force){
  const s=parseInt($('inStart').value,10), e=parseInt($('inEnd').value,10);
  if(!(s>=1&&e>=s&&e<=99)){ alert('番号の範囲が正しくありません。\n開始 ≦ 最後、1〜99の範囲で入力してください（00は使いません）。'); return false; }
  if(S.drawn.length && !force && !confirm('番号の範囲を変更すると、これまでの抽選履歴がリセットされます。よろしいですか？')) return false;
  S.start=s; S.end=e; S.drawn=[]; save(); init(); return true;
}
function init(){
  $('inStart').value=S.start; $('inEnd').value=S.end; $('inTitle').value=S.title; $('title').textContent=S.title; document.title=S.title||'抽選会';
  $('inLabel').value=S.label; $('inBase').value=S.base; $('inFake').value=S.fakeFrom;
  buildReels(); renderHist(); updateBtn();
  const lastD=S.drawn[S.drawn.length-1];
  if(lastD){ showNumber(lastD.n); machine.classList.remove('idle'); setCaption(`前回の当選：${pad(lastD.n)} 番`); }
  else { showNumber(S.start); machine.classList.add('idle'); setCaption('ボタンを押して抽選スタート！'); }
  $('prize').textContent=S.label;
}
function setSound(on){ soundOn=on; $('btnSound').textContent=on?'🔊 音ON':'🔇 音OFF'; }
function toggleFull(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
}
function toggleBar(){ document.body.classList.toggle('hideBar'); fitBar(); }
function fitBar(){ document.documentElement.style.setProperty('--barh',document.body.classList.contains('hideBar')?'0px':$('bar').offsetHeight+'px'); }

btn.onclick=()=>{ draw(); btn.blur(); };
$('btnApply').onclick=()=>applySettings(false);
$('inFake').onchange=e=>{ S.fakeFrom=Math.min(99,Math.max(1,parseInt(e.target.value,10)||1)); e.target.value=S.fakeFrom; save(); };
$('inBase').onchange=e=>{ S.base=Math.min(30,Math.max(4,parseInt(e.target.value,10)||8)); e.target.value=S.base; save(); };
$('inTitle').oninput=e=>{ S.title=e.target.value; $('title').textContent=S.title; document.title=S.title||'抽選会'; save(); };
$('inLabel').oninput=e=>{ S.label=e.target.value; save(); if(!spinning) $('prize').textContent=S.label; };
$('btnSound').onclick=()=>setSound(!soundOn);
$('btnFull').onclick=toggleFull;
$('btnHide').onclick=toggleBar; $('showBar').onclick=toggleBar;
$('btnReset').onclick=()=>{ if(spinning)return; if(confirm('抽選履歴をすべてリセットして、最初からやり直しますか？')){ S.drawn=[]; save(); init(); } };
addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); draw(); }
  else if(e.key==='f'||e.key==='F') toggleFull();
  else if(e.key==='h'||e.key==='H') toggleBar();
  else if(e.key==='m'||e.key==='M') setSound(!soundOn);
});

load(); init(); fitBar(); requestAnimationFrame(frame);
window.__lottery={force:v=>{FORCE=v;},forceN:v=>{FORCEN=v;},draw,state:()=>S};
})();
</script>
