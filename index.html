<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>令和8年度収穫祭 大抽選会</title>
<style>
/* ============ デザインテーマ（5案）：色・質感は変数で切り替え ============ */
:root,[data-theme="gold"]{            /* 1. ゴールドカジノ */
  --bg1:#12002b; --bg2:#4a0d52; --text:#fff; --text-shadow:0 2px 8px rgba(0,0,0,.6);
  --gold:#ffd54a;
  --title-grad:linear-gradient(#fff6c4,#ffd54a 55%,#ff9f1c); --title-fx:drop-shadow(0 0 14px rgba(255,160,40,.6)) drop-shadow(0 3px 0 rgba(90,30,0,.7));
  --bar-bg:rgba(0,0,0,.45); --bar-text:#fff; --input-bg:#1d0b30; --input-border:#888; --btn-ui:#3b1f5c; --btn-ui-hover:#56308a;
  --frame-bg:linear-gradient(145deg,#ffe58a,#d9902a 45%,#fff0a8 60%,#c07a14); --frame-edge:#7a4a0a;
  --frame-shadow:0 1.5vh 4vh rgba(0,0,0,.6),0 0 6vh rgba(255,200,60,.35); --dim-glow:rgba(255,213,74,.6);
  --lightA:#fff6a8; --lightB:#ff5a7a; --reels-bg:#3a1200;
  --reel-bg:linear-gradient(#cdbfa6,#fffaf0 18%,#fffaf0 82%,#cdbfa6); --reel-shade:rgba(0,0,0,.55);
  --win-reel-bg:linear-gradient(#e6c76a,#fff8d0 18%,#fff8d0 82%,#e6c76a);
  --digit:#b3123a; --digit-fx:none;
  --suspense:#ff8fab; --win-color:var(--gold); --win-glow:0 0 20px #ff9f1c,0 0 40px #e8265a;
  --btn-bg:linear-gradient(#ff5a7a,#c4123f); --btn-edge:#7d0a28; --btn-text:#fff;
  --panel-bg:rgba(0,0,0,.35); --panel-border:rgba(255,255,255,.15); --li-bg:rgba(255,255,255,.08); --li-first:linear-gradient(90deg,rgba(255,213,74,.35),rgba(255,255,255,.08));
  --font:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif; --title-weight:900; --flash:#fff;
}
[data-theme="wa"]{                    /* 2. 和風・紅白（祝い） */
  --bg1:#3a0008; --bg2:#a3122a; --text:#fff7e6; --text-shadow:0 2px 8px rgba(40,0,0,.8);
  --gold:#ffe08a;
  --title-grad:linear-gradient(#fffbe8,#ffe08a 55%,#e0a020); --title-fx:drop-shadow(0 0 12px rgba(255,200,80,.55)) drop-shadow(0 3px 0 rgba(60,0,0,.8));
  --bar-bg:rgba(40,0,6,.6); --input-bg:#2a0008; --input-border:#c99; --btn-ui:#7a1020; --btn-ui-hover:#a01830;
  --frame-bg:linear-gradient(145deg,#fffdf4,#e6dcc2 45%,#fff 60%,#d2c6a4); --frame-edge:#5a0d14;
  --frame-shadow:0 1.5vh 4vh rgba(0,0,0,.6),0 0 6vh rgba(255,230,160,.3); --dim-glow:rgba(255,224,138,.6);
  --lightA:#e0a020; --lightB:#e8283c; --reels-bg:#2a0000;
  --reel-bg:linear-gradient(#cfc2a6,#fff9ee 18%,#fff9ee 82%,#cfc2a6); --reel-shade:rgba(40,0,0,.5);
  --win-reel-bg:linear-gradient(#f0d98a,#fff6d2 18%,#fff6d2 82%,#f0d98a);
  --digit:#16110e; --digit-fx:none;
  --suspense:#ffd1a8; --win-color:#ffe08a; --win-glow:0 0 20px #ff3b3b,0 0 40px #b3001b;
  --btn-bg:linear-gradient(#e8283c,#9a0e22); --btn-edge:#560812;
  --panel-bg:rgba(40,0,6,.4); --panel-border:rgba(255,224,138,.3); --li-bg:rgba(255,255,255,.1); --li-first:linear-gradient(90deg,rgba(255,224,138,.4),rgba(255,255,255,.08));
  --font:"Yu Mincho","Hiragino Mincho ProN","Hiragino Sans",serif; --title-weight:900;
}
[data-theme="harvest"]{               /* 3. 秋の収穫祭 */
  --bg1:#2a1503; --bg2:#9a5614; --text:#fff3dc; --text-shadow:0 2px 8px rgba(30,10,0,.8);
  --gold:#ffcf5a;
  --title-grad:linear-gradient(#fff1b8,#ffc93a 55%,#e8780c); --title-fx:drop-shadow(0 0 12px rgba(255,150,30,.5)) drop-shadow(0 3px 0 rgba(60,25,0,.8));
  --bar-bg:rgba(35,16,2,.6); --input-bg:#2e1706; --input-border:#b98; --btn-ui:#6b3f17; --btn-ui-hover:#8a5424;
  --frame-bg:repeating-linear-gradient(95deg,#a66a32 0 14px,#8f5826 14px 20px,#b57b40 20px 36px,#7c4a1d 36px 40px); --frame-edge:#2d1806;
  --frame-shadow:0 1.5vh 4vh rgba(0,0,0,.6),0 0 6vh rgba(255,170,60,.3); --dim-glow:rgba(255,190,70,.6);
  --lightA:#ffe27a; --lightB:#ff8a3d; --reels-bg:#2b1a0a;
  --reel-bg:linear-gradient(#cdb98f,#fff2d2 18%,#fff2d2 82%,#cdb98f); --reel-shade:rgba(40,20,0,.5);
  --win-reel-bg:linear-gradient(#f2cf7a,#fff5c8 18%,#fff5c8 82%,#f2cf7a);
  --digit:#c2440e; --digit-fx:none;
  --suspense:#ffb066; --win-color:#ffd24a; --win-glow:0 0 20px #ff8a1c,0 0 40px #b33a00;
  --btn-bg:linear-gradient(#78c850,#2f7d1f); --btn-edge:#1a4a10;
  --panel-bg:rgba(35,16,2,.4); --panel-border:rgba(255,200,120,.25); --li-bg:rgba(255,255,255,.09); --li-first:linear-gradient(90deg,rgba(255,200,90,.4),rgba(255,255,255,.08));
  --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif; --title-weight:900;
}
[data-theme="neon"]{                  /* 4. ネオン */
  --bg1:#02020a; --bg2:#1d0645; --text:#eaf6ff; --text-shadow:0 0 10px rgba(53,242,255,.5);
  --gold:#35f2ff;
  --title-grad:linear-gradient(#c8fcff,#35f2ff 50%,#ff2bd6); --title-fx:drop-shadow(0 0 10px rgba(53,242,255,.8)) drop-shadow(0 0 24px rgba(255,43,214,.6));
  --bar-bg:rgba(2,2,14,.75); --bar-text:#dff; --input-bg:#0a0a22; --input-border:#35f2ff; --btn-ui:#1a1050; --btn-ui-hover:#2c1a7a;
  --frame-bg:linear-gradient(145deg,#14143a,#05050f); --frame-edge:#ff2bd6;
  --frame-shadow:0 0 3vh 1vh rgba(255,43,214,.6),0 0 8vh rgba(53,242,255,.35); --dim-glow:rgba(53,242,255,.7);
  --lightA:#35f2ff; --lightB:#ff2bd6; --reels-bg:#000;
  --reel-bg:linear-gradient(#05051a,#12123a 50%,#05051a); --reel-shade:rgba(0,0,0,.75);
  --win-reel-bg:linear-gradient(#1a0a40,#2a1060 50%,#1a0a40);
  --digit:#35f2ff; --digit-fx:0 0 .06em #fff,0 0 .2em #35f2ff,0 0 .45em #35f2ff;
  --suspense:#ff6be6; --win-color:#35f2ff; --win-glow:0 0 20px #35f2ff,0 0 44px #ff2bd6;
  --btn-bg:linear-gradient(#ff2bd6,#7a0bff); --btn-edge:#3a0580;
  --panel-bg:rgba(5,5,25,.6); --panel-border:rgba(53,242,255,.5); --li-bg:rgba(53,242,255,.08); --li-first:linear-gradient(90deg,rgba(255,43,214,.35),rgba(53,242,255,.08));
  --font:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif; --title-weight:900;
}
[data-theme="pop"]{                   /* 5. ポップ（お祭りカラフル） */
  --bg1:#9fdcff; --bg2:#fff0a8; --text:#2a1a4a; --text-shadow:0 2px 0 rgba(255,255,255,.9);
  --gold:#ff3d7f;
  --title-grad:linear-gradient(#ff5a7a,#ff9f1c); --title-fx:drop-shadow(3px 3px 0 #fff) drop-shadow(0 0 0 #fff) drop-shadow(0 6px 0 rgba(42,26,74,.3));
  --bar-bg:rgba(255,255,255,.88); --bar-text:#2a1a4a; --input-bg:#fff; --input-border:#2a1a4a; --btn-ui:#ffd54a; --btn-ui-hover:#ffe27a;
  --frame-bg:linear-gradient(135deg,#ff5a7a,#ffb23d,#ffe93d,#4fd16b,#3db8ff,#a46bff); --frame-edge:#2a1a4a;
  --frame-shadow:0 1.5vh 0 rgba(42,26,74,.35); --dim-glow:rgba(255,61,127,.55);
  --lightA:#ffffff; --lightB:#2a1a4a; --reels-bg:#2a1a4a;
  --reel-bg:linear-gradient(#d8d8ee,#ffffff 18%,#ffffff 82%,#d8d8ee); --reel-shade:rgba(42,26,74,.4);
  --win-reel-bg:linear-gradient(#ffe27a,#fffbe0 18%,#fffbe0 82%,#ffe27a);
  --digit:#ff3d7f; --digit-fx:.04em .04em 0 #ffd54a;
  --suspense:#7a2bff; --win-color:#ff3d7f; --win-glow:3px 3px 0 #fff,0 0 20px #fff;
  --btn-bg:linear-gradient(#ffb23d,#f07a00); --btn-edge:#a35000;
  --panel-bg:rgba(255,255,255,.65); --panel-border:#2a1a4a; --li-bg:rgba(255,255,255,.75); --li-first:linear-gradient(90deg,#ffe27a,#fff);
  --font:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif; --title-weight:900; --flash:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--text); overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg1) 70%);
}
/* きらめく背景（テーマごとに模様が変わる） */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:
    radial-gradient(2px 2px at 20% 30%,#fff,transparent),
    radial-gradient(2px 2px at 70% 20%,#ffe9a0,transparent),
    radial-gradient(3px 3px at 40% 80%,#fff,transparent),
    radial-gradient(2px 2px at 85% 65%,#ffd0e0,transparent),
    radial-gradient(2px 2px at 10% 70%,#fff,transparent),
    radial-gradient(3px 3px at 60% 50%,#ffe9a0,transparent);
  background-size:300px 300px;
  animation:drift 24s linear infinite;
}
[data-theme="wa"] .bg{background-image:radial-gradient(circle at 50% 100%,transparent 0 36%,rgba(255,255,255,.13) 37% 40%,transparent 41% 56%,rgba(255,255,255,.11) 57% 60%,transparent 61% 76%,rgba(255,255,255,.09) 77% 80%,transparent 81%);
  background-size:90px 45px;opacity:1;animation:none}
[data-theme="neon"] .bg{background-image:linear-gradient(rgba(53,242,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(53,242,255,.16) 1px,transparent 1px);
  background-size:70px 70px;opacity:.8;animation:drift 18s linear infinite}
[data-theme="pop"] .bg{background-image:radial-gradient(circle,rgba(255,255,255,.75) 7px,transparent 8px);background-size:64px 64px;opacity:.8}
[data-theme="harvest"] .bg{opacity:.55}
@keyframes drift{to{background-position:300px 600px}}

#bar{
  position:fixed;top:0;left:0;right:0;z-index:30;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;
  padding:.6rem 1rem;background:var(--bar-bg);color:var(--bar-text,var(--text));backdrop-filter:blur(4px);
  border-bottom:1px solid rgba(255,255,255,.15);box-shadow:0 .6rem 1.6rem rgba(0,0,0,.5);font-size:14px;font-family:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
}
#bar h1{font-size:18px;color:var(--gold);margin-right:auto;white-space:nowrap;text-shadow:none}
#bar label{display:flex;align-items:center;gap:.4rem;white-space:nowrap}
#bar input[type=number]{width:5.5em}
#bar input[type=text]{width:11em}
#bar #inTitle{width:16em}
#bar input,#bar select{padding:.35rem .5rem;border-radius:6px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--bar-text,var(--text));font-size:14px}
#bar button{padding:.4rem .8rem;border-radius:6px;border:1px solid rgba(128,128,128,.5);
  background:var(--btn-ui);color:var(--bar-text,var(--text));cursor:pointer;font-size:14px}
#bar button:hover{background:var(--btn-ui-hover)}
body.hideBar #bar{display:none}
body.hideBar #showBar{display:block}
#showBar{display:none;position:fixed;top:6px;right:8px;z-index:6;opacity:.25;font-size:12px;
  background:none;border:none;color:var(--text);cursor:pointer}
#showBar:hover{opacity:1}

main{position:relative;z-index:1;display:grid;grid-template-columns:1fr 22vw;gap:1.5vw;height:100%;padding:1vh 1.5vw}
.stage{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;min-width:0;min-height:0}
.stage .center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8vh;min-height:0}   /* スロット・テロップ：中央 */
.stage .bottom{display:flex;flex-direction:column;align-items:center;gap:1.2vh;padding-bottom:1vh}                   /* スタートボタン：下 */
.title{font-size:min(7vh,4.4vw);font-weight:var(--title-weight);letter-spacing:.12em;text-align:center;white-space:nowrap;
  background:var(--title-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:var(--title-fx)}

.machine{
  position:relative;padding:min(2.2vh,1.4vw);border-radius:2.5vmin;
  background:var(--frame-bg);
  box-shadow:0 0 0 .6vmin var(--frame-edge),var(--frame-shadow);
}
.machine .lights::before,.machine .lights::after{
  content:"";position:absolute;inset:.5vmin;border-radius:2vmin;pointer-events:none;
  border:.9vmin dotted #fff;
}
.machine .lights::before{animation:blinkA .7s steps(1) infinite;border-color:var(--lightA)}
.machine .lights::after{animation:blinkA .7s steps(1) infinite reverse;border-color:var(--lightB)}
@keyframes blinkA{0%{opacity:1}50%{opacity:0}}
.machine.spinning .lights::before,.machine.spinning .lights::after{animation-duration:.18s}
.machine.win{animation:shake .5s 2, glow 1s ease-in-out infinite alternate}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px) rotate(-.4deg)}
  40%{transform:translate(8px,-4px) rotate(.4deg)}60%{transform:translate(-6px,-2px)}80%{transform:translate(6px,2px)}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25) saturate(1.3)}}

.reels{position:relative;display:flex;gap:1.2vmin;padding:1.2vmin;border-radius:1.6vmin;background:var(--reels-bg);
  box-shadow:inset 0 0 2vmin #000}
.reel{height:1.15em;overflow:hidden;position:relative;border-radius:1vmin;background:var(--reel-bg)}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--reel-shade),transparent 22%,transparent 78%,var(--reel-shade));}
.strip{will-change:transform}
.cell{height:1.15em;line-height:1.15em;text-align:center;font-weight:900;color:var(--digit);
  font-family:var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .3em;text-shadow:var(--digit-fx)}
.machine.idle .reel{opacity:.85}
.machine.win .reel{background:var(--win-reel-bg)}

.caption{font-size:min(4.4vh,2.6vw);font-weight:700;min-height:1.4em;text-align:center;
  text-shadow:var(--text-shadow)}
.caption.suspense{color:var(--suspense);animation:pulse .5s ease-in-out infinite alternate}
.caption.win{font-size:min(6.5vh,4vw);color:var(--win-color);font-weight:900;
  text-shadow:var(--win-glow);animation:pop .6s cubic-bezier(.2,2,.4,1)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

.draw{
  font-size:min(5vh,3vw);font-weight:900;letter-spacing:.15em;padding:1.4vh 4vw;border-radius:999px;
  border:none;cursor:pointer;color:var(--btn-text);font-family:var(--font);
  background:var(--btn-bg);
  box-shadow:0 .8vh 0 var(--btn-edge),0 1.5vh 3vh rgba(0,0,0,.5);
  transition:transform .08s,box-shadow .08s;
}
.draw:hover:not(:disabled){filter:brightness(1.12)}
.draw:active:not(:disabled){transform:translateY(.6vh);box-shadow:0 .2vh 0 var(--btn-edge)}
.draw:disabled{filter:grayscale(.8) brightness(.7);cursor:default}
.draw.ready{animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.remain{font-size:min(2.6vh,1.6vw);opacity:.85}

.history{display:flex;flex-direction:column;min-height:0;background:var(--panel-bg);
  border:1px solid var(--panel-border);border-radius:12px;padding:1vh .8vw}
.history h2{font-size:min(2.6vh,1.5vw);color:var(--gold);margin-bottom:.8vh;text-align:center}
#hist{list-style:none;overflow:auto;flex:1;display:flex;flex-direction:column;gap:.6vh}
#hist li{display:flex;align-items:center;gap:.6em;padding:.5vh .6vw;border-radius:8px;
  background:var(--li-bg);font-size:min(3vh,1.8vw);animation:slide .4s ease-out}
#hist li:first-child{background:var(--li-first)}
#hist .num{font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;min-width:2.4em}
#hist .lbl{font-size:.7em;opacity:.8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.history .note{font-size:min(2vh,1.1vw);line-height:1.7;opacity:.65;margin-top:.8vh;padding-top:.8vh;border-top:1px solid var(--panel-border)}   /* ショートカットの説明 */
.history .note b{display:inline-block;min-width:7.6em;font-weight:700;color:var(--gold)}

/* 景品ルーレット（景品CSVを設定したときだけ表示） */
.prizeBox{position:relative;padding:.9vh;border-radius:1.8vmin;background:var(--frame-bg);
  box-shadow:0 0 0 .5vmin var(--frame-edge),var(--frame-shadow)}
.prizeBox .tag{position:absolute;left:50%;top:0;transform:translate(-50%,-58%);font-size:min(2.2vh,1.3vw);font-weight:900;
  padding:.1vh 1.2vw;border-radius:999px;background:var(--frame-edge);color:#fff;white-space:nowrap;z-index:2}
.prizeWin{padding:.8vmin;border-radius:1.2vmin;background:var(--reels-bg);box-shadow:inset 0 0 1.5vmin #000}
.reel.nameReel{font-size:var(--slotfs,min(12.5vh,8vw));width:min(var(--nameW,8em),60vw)}
.reel.prizeReel{font-size:var(--slotfs,min(12.5vh,8vw));width:min(var(--prizeW,8em),66vw);border-radius:.8vmin}
.prizeBox.win{animation:glow 1s ease-in-out infinite alternate}
.prizeBox.win .reel{background:var(--win-reel-bg)}
#prizeInfo,#peopleInfo{font-size:13px;opacity:.85}
/* CSV読み込み前：案内ボタンを表示し、抽選ボタンは隠す */
.setup{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center}
.setup button,.resultsMain button{font-size:min(3.2vh,1.9vw);font-weight:900;padding:1.3vh 2.2vw;border-radius:999px;border:none;cursor:pointer;
  color:var(--btn-text);font-family:var(--font);background:var(--btn-bg);box-shadow:0 .6vh 0 var(--btn-edge),0 1.2vh 2.4vh rgba(0,0,0,.4)}
.setup button.done{filter:saturate(.35) brightness(.85)}
body.loaded .setup{display:none}
body:not(.loaded) #drawBtn,body:not(.loaded) .remain{display:none}
/* 景品がラスト1個のときの演出：開始ボタンの色替えと、横切る「LAST ONE」の帯 */
.draw.last{background:linear-gradient(#ffe27a,#f08a10);color:#3a1200;box-shadow:0 .8vh 0 #8a4a00,0 1.5vh 3vh rgba(0,0,0,.5)}
#lastBanner{position:fixed;left:0;right:0;top:14vh;height:15vh;z-index:18;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(232,38,90,.93) 12%,rgba(255,140,30,.93) 50%,rgba(232,38,90,.93) 88%,transparent);
  color:#fff;font-weight:900;white-space:nowrap;text-shadow:0 0 1.5vh #ffd54a,.4vh .4vh 0 rgba(90,10,30,.7);transform:translateX(-110%)}
#lastBanner .en{font-size:7vh;letter-spacing:.28em;line-height:1.1}
#lastBanner .jp{font-size:4.2vh;letter-spacing:.1em}
#lastBanner.go{animation:lastIn 2.8s cubic-bezier(.2,.8,.2,1)}
@keyframes lastIn{0%{transform:translateX(-110%)}16%,80%{transform:translateX(0)}100%{transform:translateX(110%)}}
.btnRow{display:flex;align-items:center;justify-content:center;gap:3vw}                /* 抽選ボタンと結果表示ボタンを横に並べる */
.resultsMain{display:none}
body.finished .resultsMain{display:block}   /* 抽選がすべて終わったら「結果表示」ボタンを抽選終了ボタンの右に表示 */
/* 結果表示画面：誰に何が当たったかだけを一覧で見せる */
#results{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;gap:2vh;padding:3vh 3vw 2.5vh;
  background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg1) 70%);color:var(--text);font-family:var(--font)}
body.showResults #results{display:flex}
#results .resTitle{font-size:min(6.5vh,4vw);font-weight:var(--title-weight);letter-spacing:.1em;text-align:center;white-space:nowrap;
  background:var(--title-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:var(--title-fx)}
#resList{flex:1;min-height:0;overflow:auto;width:100%;max-width:1700px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,36vw),1fr));gap:1.2vh 2vw;align-content:start}

<script>
/*
 * 抽選スロット（単一HTML・外部ファイル不要）
 *   使い方：参加者CSVと景品CSVを読み込む → 抽選ボタンで「当選者の名前」→「景品」の順に抽選
 *   流れ  ：当選者を先に確定 → 名前スロットで止める → 景品スロットで止める → 当選演出
 *   構成  ：状態 → サウンド → BGM → リール → 紙吹雪 → メインループ → 抽選 → 景品 → 画面更新 → 設定・操作
 */
(() => {
'use strict';
const $ = id => document.getElementById(id);
const STORE = 'nenkai-lottery-v1';
const SPIN_SPEED = 14;            // リールの回転速度（項目/秒）
const FX_FROM = 3;                // 演出効果が始まる抽選回（固定）
const WEIGHT_FROM = 5;            // 重みが1より大きい人が当たり得る最初の抽選回（それより前は当たらない）
const THEME_EVERY = 5;            // デザイン自動切替の間隔（抽選回数）
const LAST_EXTRA_SEC = 5;         // 最後の景品の抽選だけ、当選者スロットの回転時間に足す秒数（設定に関わらず固定。景品スロットは延長しない）

/* ============ テーマ・状態 ============ */
const THEMES=[
  {id:'gold',   name:'① ゴールドカジノ',      confetti:['#ffd54a','#ff5a7a','#4fd1ff','#8dff6b','#ff9f1c','#d68bff','#fff']},
  {id:'wa',     name:'② 和風・紅白（祝い）',  confetti:['#ffffff','#e8283c','#ffe08a','#ff7a8a','#f5c542','#fff3d6']},
  {id:'harvest',name:'③ 秋の収穫祭',          confetti:['#ffcf5a','#f2711c','#c2440e','#78c850','#e8b04a','#fff3dc']},
  {id:'neon',   name:'④ ネオン',              confetti:['#35f2ff','#ff2bd6','#7a0bff','#b6ff3a','#ffffff','#ffe93d']},
  {id:'pop',    name:'⑤ ポップ（お祭り）',    confetti:['#ff3d7f','#ffb23d','#ffe93d','#4fd16b','#3db8ff','#a46bff']}
];
// S：設定と履歴（localStorage に保存）
//   people：参加者 [{name, w}]（w＝当選しやすさの重み。参加者CSVの2列目。1以上、省略時は1） / prizes：景品 [{name, qty, big}]
//   ※抽選回数＝景品の総数。景品は参加者数以下を前提にしている
//   sound・bgm：音とBGMのON/OFF（再読み込みしても保つ）
//   fx0・fx1：演出確率（演出効果が始まる回・最後の抽選） / autoTheme：5回ごとにデザインを自動で切り替えるか
//   drawn：当選履歴 [{n, who, prize, at}]  n＝参加者の通し番号 / at＝抽選した時刻
let S = { people:[], prizes:[], fx0:55, fx1:95, sound:true, bgm:true, autoTheme:true, theme:'gold', title:'令和8年度収穫祭 大抽選会', base:8, drawn:[] };
let lastFx = new Set();                         // 直前の抽選で使った演出（同じ演出の連続を避ける）
let FORCE = null, FORCEN = null, FORCEP = null;   // テスト用：演出・当選者・景品を固定する（通常は null）
let idleOn = false, idleTimer = null, bgmTimer = null, winTimer = null, lastGlitter = 0;
let reels = [], spinning = false, rolling = false, soundOn = true, prizeReel = null;   // soundOn：音のON/OFF（S.sound に保存した値を起動時に反映）

function load(){
  try{
    const o = JSON.parse(localStorage.getItem(STORE)) || {};
    for(const k of Object.keys(S)) if(k in o) S[k] = o[k];         // 想定している項目だけ引き継ぐ
  }catch(e){}
  S.people = (Array.isArray(S.people)?S.people:[]).filter(x=>x&&x.name).map(x=>({name:x.name,w:+x.w>1?+x.w:1}));   // 旧版の保存データは重み1として扱う
  if(!Array.isArray(S.prizes)) S.prizes=[];
  S.drawn = (Array.isArray(S.drawn)?S.drawn:[]).filter(d=>d.who!==undefined);   // 旧版（数字抽選）の履歴は引き継がない
  S.autoTheme = S.autoTheme!==false;
  S.sound = S.sound!==false;
  S.fx0 = Math.min(100,Math.max(0,Number.isFinite(+S.fx0)?+S.fx0:55));
  S.fx1 = Math.min(100,Math.max(0,Number.isFinite(+S.fx1)?+S.fx1:95));
  S.base = Math.min(30,Math.max(4,+S.base||8));
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
const isReady = () => S.people.length>0 && S.prizes.length>0;      // 両方のCSVが読み込み済みか
const pool = () => {                                              // まだ当たっていない参加者の通し番号
  const used = new Set(S.drawn.map(d=>d.n)), p = [];
  for(let i=0;i<S.people.length;i++) if(!used.has(i)) p.push(i);
  return p;
};
function rnd(max){           // 0..max-1 の一様乱数（crypto使用）
  const a = new Uint32Array(1), lim = Math.floor(4294967296/max)*max;
  do{ crypto.getRandomValues(a); }while(a[0]>=lim);
  return a[0]%max;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function stripFrom(names){ let B=[]; while(B.length<8) B=B.concat(shuffle(names)); return B; }   // スロットに並べる文字列（8個以上になるよう繰り返す）

/* ============ サウンド（外部ファイル不要・WebAudio） ============ */
const Snd = {
  ctx:null, master:null, nbuf:null,
  init(){
    if(!this.ctx){
      const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .8;
      const comp = this.ctx.createDynamicsCompressor();   // 音が重なっても割れにくくする
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate*2, b = this.ctx.createBuffer(1,len,this.ctx.sampleRate), d = b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.nbuf = b;
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
    return true;
  },
  ok(){ return soundOn && this.ctx; },
  tone(f,t,dur,type='square',vol=.15,slide,dest){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(dest||this.master); o.start(t); o.stop(t+dur+.02);
  },
  noise(t,dur,vol,type,freq,q=1,swell=false,dest){
    const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.nbuf; s.loop=true; f.type=type; f.frequency.value=freq; f.Q.value=q;
    if(swell){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*.4); }
    else g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest||this.master); s.start(t,Math.random()); s.stop(t+dur+.02);
  },
  tick(){ if(!this.ok())return; this.tone(1400,this.ctx.currentTime,.04,'square',.07); },
  roll(vol){ if(!this.ok())return; this.noise(this.ctx.currentTime,.05,vol,'bandpass',1700,.8); },
  start(){ if(!this.ok())return; const t=this.ctx.currentTime;
    this.tone(180,t,.5,'sawtooth',.12,900); this.noise(t,.4,.12,'highpass',3000); },
  thump(v=1){ if(!this.ok())return; const t=this.ctx.currentTime;
    this.tone(170,t,.28,'sine',.6*v,45); this.noise(t,.06,.2*v,'lowpass',1200); },
  rumble(){ if(!this.ok())return; const t=this.ctx.currentTime; this.noise(t,.9,.45,'lowpass',160,1); this.tone(55,t,.9,'sawtooth',.25,40); },
  fakewin(){ if(!this.ok())return; const t=this.ctx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,t+i*.1,.25,'square',.11)); this.noise(t+.3,.8,.2,'bandpass',2500,.7,true); },
  buzzer(){ if(!this.ok())return; const t=this.ctx.currentTime;      // 「ブッブー」
    this.tone(150,t,.28,'sawtooth',.28); this.tone(150,t+.36,.5,'sawtooth',.28); this.tone(155,t,.28,'square',.1); this.tone(155,t+.36,.5,'square',.1); },
  applause(dur,delay=0){ if(!this.ok())return; const t=this.ctx.currentTime+delay, R=(a,b)=>a+Math.random()*(b-a);
    const n=Math.floor(dur*30);
    for(let i=0;i<n;i++){ const k=i/n; if(Math.random()<1-k*.65) this.noise(t+k*dur+Math.random()*.03,.03+Math.random()*.03,.11*(1-k*.6)+.02,'bandpass',R(1500,4500),1.2); }
    this.noise(t,dur,.1,'bandpass',1400,.4,true); },
  lastOne(){ if(!this.ok())return; const t=this.ctx.currentTime;          // 「最後の抽選です」：加速する太鼓＋ジャーン
    for(let i=0;i<14;i++) this.taiko(t+i*.07,.3+i*.04);
    this.noise(t+.95,.6,.35,'highpass',5000);
    [392,493.9,587.3].forEach(f=>this.tone(f,t+1,1.1,'sawtooth',.1)); this.taiko(t+1,1); },
  numhit(){ if(!this.ok())return; const t=this.ctx.currentTime;          // 当選者が決まった「ジャン！」
    this.taiko(t,.9); [523.25,659.25,783.99].forEach(f=>this.tone(f,t,.7,'sawtooth',.1)); this.noise(t,.9,.25,'highpass',5000); },
  fake(){ if(!this.ok())return; const t=this.ctx.currentTime;     // 「ピロッ！」動き出し予告
    this.tone(500,t,.22,'square',.1,1500); this.tone(1000,t+.08,.2,'triangle',.08,2000); },
  suspense(){ if(!this.ok())return; const t=this.ctx.currentTime;   // ドン…ドン… 心臓音
    this.tone(70,t,.18,'sine',.7,40); this.tone(70,t+.16,.18,'sine',.5,40); },
  taiko(t,vol=.9){ this.tone(160,t,.4,'sine',vol,48); this.noise(t,.12,vol*.5,'lowpass',500); },
  fanfare(){
    if(!this.ok())return; const t=this.ctx.currentTime, R=(a,b)=>a+Math.random()*(b-a);
    // 1) くす玉「パーン！」＋和太鼓「ドン ドン ドドドン！」
    this.noise(t,.18,.7,'bandpass',2200,.6); this.noise(t,.5,.35,'highpass',4000);
    [0,.32,.64,.78,.92].forEach((d,i)=>this.taiko(t+d,i<2?.9:.7));
    // 2) ファンファーレ（ブラス風）
    const m=t+1.1;
    [[392,0,.14],[523.25,.14,.14],[659.25,.28,.14],[783.99,.42,.14],[1046.5,.62,1.6]].forEach(([f,d,l],i)=>{
      this.tone(f,m+d,l,'sawtooth',.13); this.tone(f*2,m+d,l,'square',.04);
      if(i>=2) this.tone(f*1.25,m+d,l,'sawtooth',.06);      // 長3度の和音で明るく
      if(i===4){ this.tone(f*1.5,m+d,l,'sawtooth',.06); this.tone(f/2,m+d,l,'triangle',.18); }
    });
    // 3) 琴・鈴のようなキラキラ音（ペンタトニック）
    const pent=[1046.5,1174.7,1318.5,1568,1760,2093,2349.3];
    for(let i=0;i<30;i++) this.tone(pent[rnd(pent.length)],m+.1+i*.075+R(0,.03),.7,'sine',.05+R(0,.03));
    // 4) シンバル
    this.noise(m+.62,2.6,.4,'highpass',6000);
    // 5) 大歓声と拍手
    this.noise(m+.3,3.6,.3,'bandpass',900,.5,true);
    for(let i=0;i<110;i++){
      const k=i/110; this.noise(m+.5+k*3.2+R(0,.05),.04,.12*(1-k*.6)+.03,'bandpass',R(1800,4200),1.2);
    }
    // 6) 締めの「ポン！」
    this.tone(1318.5,m+2.5,.5,'sine',.15); this.tone(1568,m+2.62,.8,'sine',.15);
  }
};

/* ============ BGM（合成音の簡易シーケンサー）============ */
const BGM={
  mode:'off', gain:null, step:0, next:0, timer:null,
  start(){
    if(this.timer||!Snd.ctx) return;
    this.gain=Snd.ctx.createGain(); this.gain.gain.value=0; this.gain.connect(Snd.master);
    this.next=Snd.ctx.currentTime+.1; this.timer=setInterval(()=>this.tick(),50); this.refresh();
  },
  set(mode){ if(mode===this.mode) return; this.mode=mode; this.step=0; if(Snd.ctx) this.next=Math.max(this.next,Snd.ctx.currentTime+.05); this.refresh(); },
  on(){ return soundOn&&S.bgm&&this.mode!=='off'; },
  refresh(){
    if(!this.gain) return;
    const v=this.on()?(this.mode==='spin'?.5:.4):0;
    this.gain.gain.setTargetAtTime(v,Snd.ctx.currentTime,this.mode==='off'?.12:.35);
  },
  dur(){ return this.mode==='spin'?60/150/4:60/104/2; },
  tick(){
    const c=Snd.ctx; if(!c) return;
    if(this.next<c.currentTime-.1) this.next=c.currentTime+.05;      // 遅れ（タブが非表示だった等）は取り戻さず捨てる
    while(this.next<c.currentTime+.2){
      if(this.on()) this.play(this.next);
      this.step++; this.next+=this.dur();
    }
  },
  play(t){
    const g=this.gain, st=this.step;
    if(this.mode==='idle'){            // お祭り風：ヨナ抜き音階の笛＋太鼓（8分音符×16）
      const i=st%16, L=[659.25,0,783.99,880,783.99,0,659.25,0, 587.33,0,659.25,783.99,659.25,0,587.33,0][i];
      const B=[130.81,0,0,0,98,0,0,0,110,0,0,0,98,0,0,0][i];
      if(L){ Snd.tone(L,t,.3,'triangle',.11,0,g); Snd.tone(L*2,t,.2,'sine',.035,0,g); }
      if(B) Snd.tone(B,t,.5,'triangle',.2,0,g);
      if(i%8===0) Snd.tone(150,t,.3,'sine',.55,50,g);                       // ドン
      if(i%8===4) Snd.tone(220,t,.15,'sine',.3,80,g);                       // トン
      if(i%2===1) Snd.noise(t,.03,.05,'bandpass',3500,1,false,g);          // カッ
    }else if(this.mode==='spin'){      // 回転中：テンポアップ（16分音符×32）
      const i=st%32, A=[110,110,130.81,110,146.83,110,130.81,164.81];
      if(i%2===0) Snd.tone(A[(i/2)%8],t,.12,'sawtooth',.08,0,g);
      if(i%8===0) Snd.tone(150,t,.25,'sine',.6,50,g);
      if(i%8===4) Snd.noise(t,.09,.14,'bandpass',1800,.8,false,g);
      Snd.noise(t,.02,i%2?.03:.06,'highpass',6500,1,false,g);
      if(i%2===1) Snd.tone([440,523.25,659.25,783.99,659.25,523.25][((i-1)/2)%6],t,.08,'square',.035,0,g);
    }
  }
};

const EASE={
  out:t=>1-Math.pow(1-t,3),
  inout:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  sine:t=>-(Math.cos(Math.PI*t)-1)/2
};
class Reel{
  constructor(el,items,speed,fitChars){
    this.el=el; this.items=items; this.N=this.items.length; this.speed=speed||SPIN_SPEED;
    this.strip=document.createElement('div'); this.strip.className='strip';
    for(let k=0;k<this.N*2;k++){
      const c=document.createElement('div'), text=String(this.items[k%this.N]), len=[...text].length; c.className='cell';
      if(fitChars&&len>fitChars){                     // 長い文字列だけ文字を縮めて枠に収める（セルの高さは変えない）
        const sp=document.createElement('span'); sp.style.fontSize=(fitChars/len).toFixed(3)+'em'; sp.textContent=text; c.appendChild(sp);
      }else c.textContent=text;
      this.strip.appendChild(c);
    }
    el.appendChild(this.strip); this.pos=0; this.mode='idle'; this.lastFloor=0; this.segs=[]; this.cur=null; this.render(0);
  }
  set(d){ this.pos=(this.N-d)%this.N; this.mode='idle'; this.render(0); }
  spin(){ this.mode='spin'; }
  slow(){ this.mode='slow'; }
  /* variant: normal=普通 / restart=止まったと思ったら動き出す / back=1つ戻る / crawl=じりじり /
              fast=やけに早く止まる（呼び出し側で時間を短縮） / bounce=ビヨヨン / wobble=ブルブル */
  stop(d,dur,cb,variant='normal'){
    const N=this.N, start=this.pos, dist=Math.ceil(this.speed*dur/3), raw=start+dist;
    const end=Math.ceil((raw+d)/N)*N-d;         // 表示 = (-pos) mod N なので pos ≡ -d
    this.end=end; this.cb=cb; this.segs=[]; this.cur=null; this.lastFloor=Math.floor(start);
    const mv=(to,du,ease,o={})=>this.segs.push(Object.assign({type:'move',to,dur:du,ease},o));
    const hold=(du,o={})=>this.segs.push(Object.assign({type:'hold',dur:du},o));
    const soft=()=>Snd.thump(.55);
    if(variant==='restart'){                      // 止まった…と思いきや、また動いて1〜3つ進む
      const k=1+rnd(3);
      mv(end-k,dur*.9,'out',{onEnd:soft}); hold(.5+rnd(500)/1000);
      for(let j=1;j<=k;j++){
        mv(end-k+j,.42,'inout',j===1?{onStart:()=>{Snd.fake();setCaption('あれ…？動いた！？','suspense');}}:{});
        if(j<k) hold(.12);
      }
    }else if(variant==='back'){                   // 行き過ぎて1つ逆戻り
      mv(end+1,dur,'out',{onEnd:soft}); hold(.5+rnd(400)/1000);
      mv(end,.55,'inout',{onStart:()=>{Snd.fake();setCaption('戻る…！？','suspense');}});
    }else if(variant==='crawl'){                  // ほぼ止まってから、じりじり
      const k=2+rnd(2);
      mv(end-k,dur*.85,'out');
      for(let j=1;j<=k;j++){
        mv(end-k+j-.4,.7+rnd(400)/1000,'sine',j===1?{onStart:()=>setCaption('じり…じり…','suspense')}:{});
        hold(.22+rnd(250)/1000); mv(end-k+j,.3,'inout',{onEnd:()=>Snd.tick()});
      }
    }else if(variant==='bounce'){                 // 行き過ぎてビヨヨンと跳ね返る
      mv(end+.35,dur,'out',{onEnd:()=>Snd.thump(.7)}); mv(end-.18,.2,'inout'); mv(end+.08,.14,'inout'); mv(end,.12,'inout');
    }else if(variant==='wobble'){                 // 狙いの手前でブルブル震える
      mv(end-.4,dur*.9,'out',{onEnd:()=>{Snd.rumble();setCaption('ブルブル…！？','suspense');}});
      [.3,-.25,.2,-.12,.06].forEach(a=>mv(end+a,.1,'inout')); mv(end,.1,'inout');
    }else mv(end,dur,'out');                       // normal / fast
    this.mode='stop';
  }
  update(now,dt){
    const prev=this.pos;
    if(this.mode==='slow'){ this.pos+=1.5*dt; if(this.pos>1000)this.pos%=this.N; this.render(0); return; }
    if(this.mode==='spin'){ this.pos+=this.speed*dt; if(this.pos>1000)this.pos%=this.N; }
    else if(this.mode==='stop'){
      if(!this.cur){
        const sg=this.segs.shift();
        if(sg){ this.cur=sg; sg.t0=now; sg.from=this.pos; sg.onStart&&sg.onStart(); }
      }
      if(this.cur){
        const sg=this.cur, t=Math.min(1,(now-sg.t0)/(sg.dur*1000));
        if(sg.type==='move') this.pos=sg.from+(sg.to-sg.from)*EASE[sg.ease](t);
        if(t>=1){ if(sg.type==='move') this.pos=sg.to; this.cur=null; sg.onEnd&&sg.onEnd(); }
      }
      if(!this.cur && !this.segs.length){
        this.pos=((this.end%this.N)+this.N)%this.N; this.mode='done'; this.render(0);
        const cb=this.cb; this.cb=null; cb&&cb(); return;
      }
      const f=Math.floor(this.pos); if(f!==this.lastFloor){ this.lastFloor=f; Snd.tick(); }
    } else return;
    const speed=Math.abs(this.pos-prev)/Math.max(dt,.001);   // 速さに応じてブラー
    this.render(Math.min(3,Math.max(0,(speed-3)/11*3)));
  }
  render(blur){
    const N=this.N, idx=((-this.pos)%N+N)%N;      // pos が増えるほど項目は上→下へ流れる
    this.strip.style.transform=`translateY(${-idx/(2*N)*100}%)`;
    this.strip.style.filter=blur>.3?`blur(${blur.toFixed(1)}px)`:'';
  }
}

/* ============ 紙吹雪 ============ */
const cv=$('fx'), cx=cv.getContext('2d'); let parts=[], dpr=1;
function resizeFx(){ dpr=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; }
addEventListener('resize',resizeFx); resizeFx();
let COLORS=THEMES[0].confetti;
function burst(x,y,n,ang,spread,power){
  for(let i=0;i<n;i++){
    const a=ang+(Math.random()-.5)*spread, v=power*(.4+Math.random()*.8);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:3+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:COLORS[rnd(COLORS.length)],life:0,max:140+Math.random()*100,round:Math.random()<.25});
  }
}
function rain(n){
  for(let i=0;i<n;i++) parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
    r:4+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:COLORS[rnd(COLORS.length)],life:0,max:260,round:Math.random()<.2});
}
function glitter(){      // 待機中のキラキラ（ゆっくり舞う）
  for(let i=0;i<3;i++) parts.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*.6,vy:.6+Math.random()*.8,g:.004,
    r:2+Math.random()*3,rot:Math.random()*6,vr:(Math.random()-.5)*.1,c:COLORS[rnd(COLORS.length)],life:0,max:900,round:true});
}
function celebrate(){
  const W=innerWidth,H=innerHeight;
  burst(0,H,120,-Math.PI/3,.9,26); burst(W,H,120,-Math.PI*2/3,.9,26);
  burst(W/2,H*.45,150,-Math.PI/2,Math.PI*2,22);
  rain(120);
  [400,900,1500,2200,2900,3600].forEach((t,k)=>setTimeout(()=>{
    burst(Math.random()*W,H*(.2+Math.random()*.3),90,0,Math.PI*2,18);
    if(k%2) burst(0,H,60,-Math.PI/3,.9,26), burst(W,H,60,-Math.PI*2/3,.9,26);
    if(k==2||k==5) rain(100);
  },t));
}
function stepFx(){
  cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,cv.width,cv.height); cx.scale(dpr,dpr);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life++; p.vy+=(p.g===undefined?.35:p.g); p.vx*=.992; p.vy*=.992; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    if(p.life>p.max||p.y>innerHeight+30){ parts.splice(i,1); continue; }
    cx.globalAlpha=Math.min(1,(p.max-p.life)/30); cx.fillStyle=p.c;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    if(p.e){ cx.font=`${p.r*5}px serif`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(p.e,0,0); }
    else if(p.round){ cx.beginPath(); cx.arc(0,0,p.r*.6,0,7); cx.fill(); } else cx.fillRect(-p.r,-p.r*.5,p.r*2,p.r);
    cx.restore();
  }
}

/* ============ メインループ ============ */
let last=performance.now(), nextRoll=0, rollStart=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  reels.forEach(r=>r.update(now,dt));
  if(prizeReel) prizeReel.update(now,dt);
  if(rolling && now>=nextRoll){                        // ドラムロール
    const k=Math.min(1,(now-rollStart)/6000);
    Snd.roll(.05+.2*k); nextRoll=now+75-30*k;
  }
  if(idleOn&&now-lastGlitter>800){ lastGlitter=now; glitter(); }
  if(parts.length) stepFx(); else if(cx) cx.clearRect(0,0,cv.width,cv.height);
  requestAnimationFrame(frame);
}

/* ============ 抽選 ============ */
const cap=$('caption'), machine=$('machine'), btn=$('drawBtn');
function setCaption(t,cls=''){ cap.className='caption '+cls; cap.textContent=t; }

/* 演出確率：演出が始まる回（FX_FROM）の fx0% → 最後の抽選の fx1% へ直線的に上がる（prog=0〜1） */
const fxProb=prog=>(S.fx0+(S.fx1-S.fx0)*prog)/100;
// 演出の進行度 0〜1：演出効果が始まる回（FX_FROM）=0、最後の抽選=1。抽選回数＝景品の総数（景品は参加者数以下が前提）
function drawProgress(){
  const total=S.prizes.reduce((a,x)=>a+x.qty,0), idx=S.drawn.length+1;
  return total<=FX_FROM?1:Math.min(1,Math.max(0,(idx-FX_FROM)/(total-FX_FROM)));
}
const rv=()=>{ const r=rnd(100); return r<20?'restart':r<38?'back':r<56?'crawl':r<70?'fast':r<85?'bounce':'wobble'; };

// 当選者を選ぶ。各人の重み w（参加者CSVの2列目の倍率。通常は1）に比例して当たりやすい。ただし重みが1より大きい人は、
//   ・WEIGHT_FROM 回目より前は当たらない（序盤で当たると不自然なため）
//   ・残りの抽選回数が、まだ当たっていない該当者の人数以下になったら、その人たちの中から必ず選ぶ（取りこぼし防止）
// 名前スロットの見た目や画面表示は、重みの有無に関係なく同じ
function pickWinner(p){
  const w=i=>S.people[i].w;
  const weighted=a=>{                                   // 重みに比例して1人選ぶ
    let r=rnd(1e9)/1e9*a.reduce((t,i)=>t+w(i),0);
    for(const i of a){ r-=w(i); if(r<0) return i; }
    return a[a.length-1];
  };
  const boosted=p.filter(i=>w(i)>1), rest=p.filter(i=>w(i)===1);
  if(boosted.length){
    const idx=S.drawn.length+1, left=prizeUnits().length;      // idx：今回が何回目か / left：今回を含む残りの抽選回数
    if(boosted.length>=left||!rest.length) return weighted(boosted);
    if(idx<WEIGHT_FROM) return weighted(rest);
  }
  return weighted(p);
}
const isLastPrize = () => prizeUnits().length===1;                  // 景品が残り1個か
const idleCaption = () => isLastPrize()?'🔥 ラスト1個！最後の抽選です':'ボタンを押して抽選スタート！';
function showLastBanner(){ const b=$('lastBanner'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); }
function draw(){
  if(spinning||!isReady()) return;
  const p=pool(); if(!p.length||!prizeUnits().length) return;
  const lastOne=isLastPrize();                       // 最後の1個の抽選か
  Snd.init(); BGM.start(); stopIdle(); clearTimeout(bgmTimer); clearTimeout(winTimer); BGM.set('spin');
  if(S.autoTheme&&S.drawn.length>0&&S.drawn.length%THEME_EVERY===0) nextTheme();   // 5回ごとにデザインを切り替え（6回目・11回目…の抽選開始時）
  const n=(FORCEN!=null&&p.includes(FORCEN))?FORCEN:pickWinner(p);   // 先に当選者を確定
  // 名前スロット：まだ当たっていない人の名前を並べる
  const strip=stripFrom(p.map(i=>S.people[i].name));
  const posOf=name=>{ const c=strip.map((x,i)=>x===name?i:-1).filter(i=>i>=0); return c[rnd(c.length)]; };
  const target=posOf(S.people[n].name);
  const fakeCands=p.filter(i=>S.people[i].name!==S.people[n].name);     // フェイク当選に使える別の人
  setNameReel(strip);
  spinning=true; rolling=true; btn.disabled=true; btn.classList.remove('ready'); btn.textContent='抽選中…';
  machine.classList.remove('idle','win','buzz'); machine.classList.add('spinning');
  document.body.classList.remove('dim');
  setCaption('回転中…ドキドキ！');
  $('prizeBox').classList.remove('win'); showPrizeIdle('🎁 ？？？');
  Snd.start(); reels[0].spin(); rollStart=performance.now(); nextRoll=0;
  if(lastOne){ showLastBanner(); Snd.lastOne(); }     // 「LAST ONE」の帯と効果音

  // 当選者スロットが止まるまでの時間 = 基本時間 × 0.5〜1.6倍のランダム。最後の景品の抽選だけは「基本時間＋LAST_EXTRA_SEC」で固定
  const T=lastOne?S.base+LAST_EXTRA_SEC:Math.min(45,Math.max(4,S.base*(0.5+rnd(1101)/1000)));
  const D1=Math.min(3.4,T*.5)*1000, stopAt=T*1000-D1;

  // ---- 演出：3回目（FX_FROM）以降に発生し、終盤ほど起こりやすくなる ----
  const active=S.drawn.length+1>=FX_FROM, prog=drawProgress();
  const roll=()=>{                                   // 戻り値：v＝止まり方 / fake＝フェイク当選 / dim＝暗転
    const N={v:'normal',fake:false,dim:false};
    if(!active) return N;
    if(FORCE){                                       // テスト用
      if(FORCE==='fakewin') return fakeCands.length?{...N,fake:true}:N;
      if(FORCE==='dim') return {...N,dim:true};
      return {...N,v:FORCE};
    }
    let v='normal', fake=false;
    if(rnd(1000)<fxProb(prog)*1000){                 // 発生率 fx0% → fx1%
      if(fakeCands.length&&prog>=.35&&rnd(100)<25) fake=true; else v=rv();   // フェイク当選は中盤以降
    }
    return {v,fake,dim:rnd(1000)<fxProb(prog)*500};   // 暗転は半分の確率
  };
  const fxOf=r=>{ const f=new Set(); if(r.v!=='normal') f.add(r.v); if(r.fake) f.add('fakewin'); if(r.dim) f.add('dim'); return f; };
  let R=roll();                                      // 前回と同じ演出なら引き直す
  if(!FORCE){
    for(let k=0;k<30&&[...fxOf(R)].some(x=>lastFx.has(x));k++) R=roll();
    if([...fxOf(R)].some(x=>lastFx.has(x))) R={v:'normal',fake:false,dim:false};   // どうしても重なるなら演出なし
  }
  lastFx=fxOf(R);
  if(lastOne&&!FORCE){ R.dim=true; lastFx.add('dim'); }   // 最後の1個は必ず暗転で溜める

  // フェイク当選用の「ウソの当選者」
  let fakeTgt=null, fakeText='';
  if(R.fake){ const f=fakeCands[rnd(fakeCands.length)]; fakeTgt=posOf(S.people[f].name); fakeText=`${S.people[f].name} さん`; }

  const suspenseFx=()=>{
    setCaption('当選者は…！？','suspense');
    Snd.suspense(); setTimeout(()=>Snd.suspense(),520); setTimeout(()=>Snd.suspense(),1040);
    if(R.dim) document.body.classList.add('dim');
    BGM.set('off');                                  // 止まる直前は無音で溜める
  };
  let fakePhase=R.fake;
  const onStop=()=>{ Snd.thump(); if(fakePhase) fakeFlow(); else prizeStage(n); };
  // フェイク当選：いったん偽の当選者で当選っぽく止める→「ブッブー」→再回転
  const fakeFlow=()=>{
    document.body.classList.remove('dim'); machine.classList.add('win');
    setCaption(`🎉 ${fakeText}　当選！？ 🎉`,'win'); Snd.fakewin();
    setTimeout(()=>{ machine.classList.remove('win'); machine.classList.add('buzz'); setCaption('…と思った？','suspense'); Snd.buzzer(); },1600);
    setTimeout(()=>{
      machine.classList.remove('buzz'); setCaption('まだまだ！本番はここから！','suspense');
      fakePhase=false; BGM.set('spin'); Snd.start(); reels[0].spin(); rollStart=performance.now(); nextRoll=0;
      setTimeout(suspenseFx,1300); setTimeout(()=>reels[0].stop(target,3.2,onStop),2200);
    },2900);
  };

  let at=stopAt, dur=D1/1000;
  if(R.v==='fast'){ dur=.55; at=Math.max(900,stopAt*.55); }          // やけに早く止まる
  setTimeout(suspenseFx,Math.max(0,at-1400));
  setTimeout(()=>reels[0].stop(R.fake?fakeTgt:target,dur,onStop,R.v),at);
}

/* ---- 景品 ---- */
function prizeLeft(){            // 景品ごとの残り数
  const used={}; S.drawn.forEach(d=>{ if(d.prize) used[d.prize]=(used[d.prize]||0)+1; });
  return S.prizes.map(x=>({name:x.name,left:Math.max(0,x.qty-(used[x.name]||0))}));
}
function prizeUnits(){ const u=[]; prizeLeft().forEach(x=>{ for(let i=0;i<x.left;i++) u.push(x.name); }); return u; }
function celebrateSmall(){ const W=innerWidth,H=innerHeight; burst(W/2,H*.4,90,-Math.PI/2,Math.PI*1.6,20); rain(40); }
const winLabel = n => `${S.people[n].name} さん`;
function entryFor(n,prize){ const x=S.people[n]; return {n,who:x.name,prize,at:Date.now()}; }   // at：抽選した時刻

// 当選者のあとに景品を抽選する
function prizeStage(n){
  rolling=false;
  const units=prizeUnits(), name=(FORCEP&&units.includes(FORCEP))?FORCEP:units[rnd(units.length)];
  let names=[...new Set(units)];
  if(names.length<3) names=S.prizes.map(x=>x.name);     // 残りの種類が少ないときは、全景品を流して見栄えを保つ
  const B=stripFrom(names);
  const cands=B.map((x,i)=>x===name?i:-1).filter(i=>i>=0), tIdx=cands[rnd(cands.length)];
  // ① 当選者を軽くお祝い
  document.body.classList.remove('dim'); machine.classList.remove('spinning','buzz'); machine.classList.add('win');
  BGM.set('off'); setCaption(`🎉 ${winLabel(n)}　当選！ 🎉`,'win'); Snd.numhit(); celebrateSmall();
  // ② 景品スロット開始
  setTimeout(()=>{
    machine.classList.remove('win'); setCaption('🎁 景品は…！？','suspense');
    setPrizeReel(B).spin(); rolling=true; rollStart=performance.now(); nextRoll=0; BGM.set('spin'); Snd.start();
    const active=S.drawn.length+1>=FX_FROM, prog=drawProgress();
    let v='normal';                                                          // 景品スロットの演出（名前スロットより15ポイント低い確率）
    if(active&&rnd(1000)<Math.max(0,fxProb(prog)-.15)*1000){
      const c=['restart','back','crawl','bounce','wobble'].filter(x=>!lastFx.has(x)); if(c.length) v=c[rnd(c.length)];
    }
    if(v!=='normal') lastFx.add(v);
    const Tp=Math.max(3,S.base*(.45+rnd(500)/1000)), D=Math.min(3.4,Tp*.55), at=(Tp-D)*1000;
    setTimeout(()=>{ BGM.set('off'); Snd.suspense(); setTimeout(()=>Snd.suspense(),520); },Math.max(0,at-1000));
    setTimeout(()=>prizeReel.stop(tIdx,D,()=>{
      Snd.thump();
      S.drawn.push(entryFor(n,name)); save();
      finish(n,name);
    },v),at);
  },1900);
}
// 大当たりかどうかは景品CSVの3列目（区分）だけで決まる
function isBig(name){ const pr=S.prizes.find(x=>x.name===name); return !!(pr&&pr.big); }

function showClaps(ms,text){
  const box=$('claps'); box.innerHTML='';
  const tx=document.createElement('div'); tx.className='clap-text'; tx.textContent=text; tx.style.animationDuration=(ms/1000+1)+'s'; box.appendChild(tx);
  const t0=performance.now(), iv=setInterval(()=>{
    if(performance.now()-t0>ms-1500){ clearInterval(iv); return; }
    const e=document.createElement('div'); e.className='clap-emoji'; e.textContent=['👏','👏','👏','🎉','✨'][rnd(5)];
    e.style.left=(Math.random()*96)+'vw'; e.style.fontSize=(5+Math.random()*5)+'vh'; e.style.setProperty('--rot',(Math.random()*60-30)+'deg');
    e.style.animationDuration=(1.8+Math.random()*1.6)+'s'; box.appendChild(e); setTimeout(()=>e.remove(),3600);
  },140);

  if(spinning||!isReady()) return;

function finish(n,prize){
  spinning=false; rolling=false;
  const big=isBig(prize);
  document.body.classList.remove('dim'); machine.classList.remove('spinning','buzz'); machine.classList.add('win');
  $('prizeBox').classList.add('win');
  setCaption(big?`🌾 ${winLabel(n)}　大当たり！！ 🌾`:`🎉 ${winLabel(n)}　おめでとう！ 🎉`,'win');
  BGM.set('off'); clearTimeout(bgmTimer);
  Snd.fanfare(); celebrate();                        // 大当たりも演出は通常と同じ（表示のみ変える）
  Snd.applause(5,2);                                 // 拍手
  const allDone=!(pool().length>0&&prizeUnits().length>0);          // これで抽選がすべて終わりか
  showClaps(6000,allDone?'パチパチパチパチ！！　これで抽選はすべて終了です！　ありがとうございました！　👏👏👏':'パチパチパチパチ！！　おめでとう！！　👏👏👏');

  clearTimeout(idleTimer); idleTimer=setTimeout(startIdle,30000);              // 30秒操作がなければ待機アニメ
}

const esc = t => String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ 設定・操作 ============ */
function init(){
  stopIdle(); document.title=S.title||'抽選会';
  $('inTitle').value=S.title; $('title').textContent=S.title;
  $('inBase').value=S.base; $('inFx0').value=S.fx0; $('inFx1').value=S.fx1;
  updateMetrics(); renderHist(); updateBtn();
  if(!isReady()){                                    // CSV読み込み前
    setNameReel(['👥 ？？？']).set(0); showPrizeIdle('🎁 ？？？'); machine.classList.add('idle');
    setCaption('参加者CSVと景品CSVを読み込んでください'); return;
  }
  const lastD=S.drawn[S.drawn.length-1], lp=[...S.drawn].reverse().find(d=>d.prize);
  showPrizeIdle(lp?lp.prize:'🎁 ？？？');
  if(lastD){
    setNameReel([lastD.who]).set(0); machine.classList.remove('idle'); setCaption(isLastPrize()?idleCaption():`前回の当選：${lastD.who} さん`);
  }else startIdle();                                 // まだ抽選していない：待機アニメ
}
function nextTheme(){ const i=THEMES.findIndex(x=>x.id===S.theme); applyTheme(THEMES[(i+1)%THEMES.length].id); }
function applyTheme(id){
  const t=THEMES.find(x=>x.id===id)||THEMES[0];
  S.theme=t.id; document.documentElement.dataset.theme=t.id; COLORS=t.confetti;
  $('selTheme').value=t.id; $('chkAuto').checked=S.autoTheme; save();
}
/* ---- CSV（参加者・景品） ---- */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','||c==='\t'){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const toHalf = t => t.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim();
function parsePrizes(text){
  const rows=parseCSV(text).map(r=>r.map(x=>x.trim())).filter(r=>r[0]);
  if(rows.length){                                   // 見出し行（2列目が数字でない／1列目が「景品名」等）は読み飛ばす
    const r=rows[0], q=r[1]!==undefined&&r[1]!==''?toHalf(r[1]):'';
    if((q&&!/^\d+$/.test(q))||/^(景品名?|品名|名称|name|prize)$/i.test(r[0])) rows.shift();
  }
  const map=new Map();
  rows.forEach(r=>{
    const q=r[1]!==undefined&&r[1]!==''?toHalf(r[1]):'1';
    const qty=/^\d+$/.test(q)?Math.min(999,parseInt(q,10)):1;
    const mark=r[2]!==undefined&&r[2]!==''&&!/^(0|×|✕|no|いいえ|なし|-|－|通常|一般|普通)$/i.test(toHalf(r[2]));   // 3列目（区分）に何か書いてあれば大当たり。空欄・通常などは対象外
    if(qty>0){ const o=map.get(r[0])||{qty:0,big:false}; o.qty+=qty; o.big=o.big||mark; map.set(r[0],o); }
  });
  return [...map].map(([name,o])=>({name,qty:o.qty,big:o.big}));
}
function parsePeople(text){
  const rows=parseCSV(text).map(r=>r.map(x=>x.trim())).filter(r=>r[0]);
  if(rows.length&&/^(氏名|名前|参加者名?|社員名|name)$/i.test(rows[0][0])) rows.shift();   // 見出し行は読み飛ばす
  return rows.map(r=>{                               // 2列目＝重み（倍率）。1より大きい数だけ有効。空欄・数字でない・1以下は1（下げる指定は想定しない）
    const w=parseFloat(toHalf(r[1]||''));
    return {name:r[0],w:w>1?Math.min(1000,w):1};
  });
}
async function readCsvFile(f){            // UTF-8／Shift_JIS（ExcelのCSV）どちらも読む
  const buf=await f.arrayBuffer();
  let text; try{ text=new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(_){ text=new TextDecoder('shift_jis').decode(buf); }
  return text.replace(/^\uFEFF/,'');
}
async function loadCsv(f,kind){
  if(!f||spinning) return;
  const text=await readCsvFile(f);
  let list=kind==='people'?parsePeople(text):parsePrizes(text);
  if(!list.length){
    alert(kind==='people'?'参加者を読み取れませんでした。\n1列目＝氏名、2列目＝確率（省略可）のCSVにしてください。'
                         :'景品を読み取れませんでした。\n1列目＝景品名、2列目＝数量（省略可）、3列目＝区分（省略可）のCSVにしてください。');
    return;
  }
  if(kind==='people'&&list.length>999){ alert('参加者が多すぎるため、先頭の999名だけを読み込みます。'); list=list.slice(0,999); }
  if(S.drawn.length&&!confirm('CSVを読み込むと、これまでの抽選履歴がリセットされます。よろしいですか？')) return;
  if(kind==='people') S.people=list; else S.prizes=list;
  S.drawn=[]; save(); init();
}
function setSound(on){ soundOn=S.sound=on; save(); $('btnSound').textContent=on?'🔊 音ON':'🔇 音OFF'; BGM.refresh(); }
function setBgm(on){ S.bgm=on; $('btnBgm').textContent=on?'🎵 BGM ON':'🎵 BGM OFF'; save(); BGM.refresh(); }
function toggleFull(){

  else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();

function toggleBar(){ document.body.classList.toggle('hideBar'); }

btn.onclick=()=>{ draw(); btn.blur(); };
const fxChange=()=>{ S.fx0=Math.min(100,Math.max(0,parseInt($('inFx0').value,10)||0)); S.fx1=Math.min(100,Math.max(0,parseInt($('inFx1').value,10)||0)); $('inFx0').value=S.fx0; $('inFx1').value=S.fx1; save(); };
$('inFx0').onchange=fxChange; $('inFx1').onchange=fxChange;
$('inBase').onchange=e=>{ S.base=Math.min(30,Math.max(4,parseInt(e.target.value,10)||8)); e.target.value=S.base; save(); };

$('selTheme').innerHTML=THEMES.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
$('selTheme').onchange=e=>{ applyTheme(e.target.value); e.target.blur(); };

$('inPrize').onchange=async e=>{ await loadCsv(e.target.files[0],'prizes'); e.target.value=''; };
$('btnSetPeople').onclick=()=>$('inPeople').click();            // メイン画面の案内ボタン → 設定バーのファイル選択を開く
$('btnSetPrize').onclick=()=>$('inPrize').click();
$('btnBgm').onclick=()=>setBgm(!S.bgm);
$('btnSound').onclick=()=>setSound(!soundOn);
$('btnFull').onclick=toggleFull;
$('btnHide').onclick=toggleBar; $('showBar').onclick=toggleBar;
$('btnExport').onclick=exportResult;
$('btnResults').onclick=()=>showResults(true); $('btnResClose').onclick=()=>showResults(false);
$('btnReset').onclick=()=>{ if(spinning)return; if(confirm('抽選履歴をすべてリセットして、最初からやり直しますか？（CSVはそのまま残ります）')){ S.drawn=[]; save(); init(); } };
// ボタン等をクリックした後にフォーカスが残ると、Space で別の操作が走ってしまうので、クリック後にフォーカスを外す
addEventListener('click',e=>{ const t=e.target.closest('button,input[type=checkbox]'); if(t) t.blur(); });
addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){
    if(e.key==='Enter'||e.key==='Escape') e.target.blur();      // 入力が済んだら、ショートカットが効く状態に戻す
    return;
  }
  if(document.body.classList.contains('showResults')){          // 結果表示中は Esc / E で閉じるだけ
    if(e.key==='Escape'||e.key==='e'||e.key==='E') showResults(false);
    return;
  }
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); draw(); }
  else if(e.key==='f'||e.key==='F') toggleFull();
  else if(e.key==='h'||e.key==='H') toggleBar();
  else if(e.key==='m'||e.key==='M') setSound(!soundOn);
  else if(e.key==='b'||e.key==='B') setBgm(!S.bgm);
  else if(e.key==='t'||e.key==='T') nextTheme();
  else if(e.key==='e'||e.key==='E') showResults(true);
});

load(); applyTheme(S.theme); setSound(S.sound); setBgm(S.bgm); init();
// 最初のクリック／キー操作で音声を有効化（ブラウザの仕様）し、待機BGMを開始
const unlock=()=>{ Snd.init(); BGM.start(); removeEventListener('pointerdown',unlock); removeEventListener('keydown',unlock); };
addEventListener('pointerdown',unlock); addEventListener('keydown',unlock); requestAnimationFrame(frame);
/* テスト用の公開口（画面操作には不要） */
window.__lottery={pick:pickWinner,pool,entryFor,parsePeople,parsePrizes,isBig,prizeUnits,lastFx:()=>[...lastFx],bgm:()=>({mode:BGM.mode,running:!!BGM.timer}),
  force:v=>{FORCE=v;},forceN:v=>{FORCEN=v;},forceP:v=>{FORCEP=v;},draw,state:()=>S};
})();
